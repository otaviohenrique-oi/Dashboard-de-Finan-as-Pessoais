<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desenha & Adivinha</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap');

:root {
  --bg:#16232C;
  --bg-2:#1F323D;
  --bg-3:#263F4C;
  --canvas-bg:#FDFBF3;
  --ink:#EDEAE0;
  --ink-dim:#9FB2BA;
  --yellow:#FFC53D;
  --pink:#FF5C8A;
  --teal:#2FD4C4;
  --purple:#B490F0;
  --line:rgba(255,255,255,.10);
  --radius:14px;
}

* {
  box-sizing:border-box;
}

html,body {
  margin:0;
  padding:0;
}

body {
  background:radial-gradient(
    circle at 20% -10%,
    #223744 0%,
    var(--bg) 55%
  );
  color:var(--ink);
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh;
  padding:20px 14px 60px;
}

h1,h2,h3,.marker {
  font-family:'Kalam',cursive;
}

.wrap {
  max-width:980px;
  margin:0 auto;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.brand .dot {
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--pink);
  box-shadow:
    18px 0 0 var(--yellow),
    36px 0 0 var(--teal);
}

.brand h1 {
  font-size:30px;
  margin:0;
  letter-spacing:.5px;
}

.brand p {
  margin:2px 0 0;
  color:var(--ink-dim);
  font-size:13px;
}

.card {
  background:var(--bg-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:16px;
}

.join-row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

input[type="text"] {
  flex:1;
  min-width:180px;
  background:var(--bg-3);
  border:1px solid var(--line);
  color:var(--ink);
  padding:12px 14px;
  border-radius:10px;
  font-size:15px;
  font-family:inherit;
}

input[type="text"]:focus {
  outline:2px solid var(--teal);
}

button {
  font-family:'Kalam',cursive;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:10px;
  padding:11px 20px;
  cursor:pointer;
  background:var(--yellow);
  color:#22160A;
  transition:transform .12s ease;
}

button:hover:not(:disabled) {
  transform:translateY(-1px);
}

button:active:not(:disabled) {
  transform:translateY(0) scale(.98);
}

button:disabled {
  opacity:.4;
  cursor:not-allowed;
}

button.secondary {
  background:var(--bg-3);
  color:var(--ink);
  border:1px solid var(--line);
}

button.pink {
  background:var(--pink);
  color:#2A0A16;
}

button.teal {
  background:var(--teal);
  color:#052824;
}

.player-list {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:16px;
}

.chip {
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg-3);
  border:1px solid var(--line);
  padding:7px 12px 7px 7px;
  border-radius:999px;
  font-size:14px;
}

.avatar {
  width:26px;
  height:26px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Kalam',cursive;
  font-weight:700;
  font-size:13px;
  color:#1a1a1a;
  flex-shrink:0;
}

.host-badge {
  font-size:10px;
  color:var(--yellow);
  margin-left:2px;
}

.hint {
  color:var(--ink-dim);
  font-size:13px;
  margin-top:10px;
  line-height:1.5;
}

.game-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
}

.round-info {
  font-size:14px;
  color:var(--ink-dim);
}

.round-info b {
  color:var(--ink);
}

.timer {
  font-family:'Kalam',cursive;
  font-size:26px;
  font-weight:700;
  background:var(--bg-3);
  border:1px solid var(--line);
  padding:4px 16px;
  border-radius:10px;
  min-width:64px;
  text-align:center;
}

.timer.low {
  color:var(--pink);
}

.word-banner {
  text-align:center;
  font-family:'Kalam',cursive;
  font-size:22px;
  letter-spacing:4px;
  padding:10px;
  margin-bottom:14px;
  border-radius:10px;
  background:var(--bg-3);
  border:1px solid var(--line);
}

.word-banner.drawer {
  color:var(--yellow);
  letter-spacing:1px;
}

.play-area {
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  align-items:flex-start;
}

.canvas-col {
  flex:2 1 420px;
  min-width:300px;
}

.side-col {
  flex:1 1 260px;
  min-width:240px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.canvas-frame {
  position:relative;
  padding:10px;
}

.canvas-frame svg.wobble {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

canvas {
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:700 / 440;
  background:var(--canvas-bg);
  border-radius:8px;
  touch-action:none;
  cursor:crosshair;
  position:relative;
  z-index:1;
}

.tools {
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}

.swatch {
  width:28px;
  height:28px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
}

.swatch.active {
  border-color:var(--ink);
  transform:scale(1.12);
}

.size-dot {
  border-radius:50%;
  background:var(--ink);
  cursor:pointer;
  border:2px solid transparent;
}

.size-dot.active {
  border-color:var(--yellow);
}

.scoreboard {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.score-row {
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg-3);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  font-size:14px;
}

.score-row .name {
  flex:1;
}

.score-row .pts {
  font-family:'Kalam',cursive;
  font-weight:700;
  color:var(--yellow);
}

.score-row.drawing {
  outline:1px solid var(--teal);
}

.chat {
  background:var(--bg-3);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  height:220px;
  display:flex;
  flex-direction:column;
}

.chat-log {
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:6px;
  padding-right:4px;
}

.chat-msg {
  font-size:13.5px;
  line-height:1.4;
}

.chat-msg .who {
  font-weight:700;
}

.chat-msg.correct {
  color:var(--teal);
  font-family:'Kalam',cursive;
  font-size:14.5px;
}

.chat-msg.system {
  color:var(--ink-dim);
  font-style:italic;
}

.chat-form {
  display:flex;
  gap:6px;
  margin-top:8px;
}

.chat-form input {
  padding:9px 10px;
  font-size:13.5px;
}

.chat-form button {
  padding:9px 14px;
  font-size:13.5px;
}

.reveal {
  text-align:center;
  padding:26px 10px;
}

.reveal .w {
  font-family:'Kalam',cursive;
  font-size:34px;
  color:var(--yellow);
  margin:6px 0 2px;
}

.reveal .sub {
  color:var(--ink-dim);
  font-size:14px;
}

.winner-banner {
  text-align:center;
  padding:10px 0 20px;
}

.winner-banner .w {
  font-family:'Kalam',cursive;
  font-size:30px;
  color:var(--yellow);
}

.status-box {
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  background:rgba(47,212,196,.08);
  border:1px solid rgba(47,212,196,.18);
  color:var(--ink-dim);
  font-size:13px;
}

@media(max-width:640px) {
  .brand h1 {
    font-size:24px;
  }

  .word-banner {
    font-size:18px;
    letter-spacing:2px;
  }

  .card {
    padding:16px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <div class="dot"></div>

    <div>
      <h1>Desenha &amp; Adivinha</h1>
      <p>
        até 4 jogadores · todo mundo desenha, todo mundo adivinha
      </p>
    </div>
  </div>

  <div id="app"></div>

</div>

<script>
(function () {

  /* =========================================================
     CONFIGURAÇÃO
  ========================================================= */

  const FIREBASE_DB_URL =
    "https://desenha-e-adivinha-19968-default-rtdb.firebaseio.com";

  const META_PATH = "/game/meta.json";
  const STROKES_PATH = "/game/strokes.json";

  const POLL_MS = 1100;

  const ROUND_DURATION = 70;
  const ROUND_END_PAUSE = 5;

  const MAX_PLAYERS = 4;


  /* =========================================================
     PALAVRAS
  ========================================================= */

  const WORDS = [
    "gato",
    "cachorro",
    "sol",
    "lua",
    "estrela",
    "árvore",
    "casa",
    "carro",
    "bicicleta",
    "avião",
    "barco",
    "guarda-chuva",
    "chapéu",
    "óculos",
    "relógio",
    "coração",
    "flor",
    "peixe",
    "pássaro",
    "borboleta",
    "elefante",
    "girafa",
    "leão",
    "macaco",
    "cobra",
    "aranha",
    "robô",
    "foguete",
    "castelo",
    "coroa",
    "chave",
    "porta",
    "janela",
    "escada",
    "ponte",
    "montanha",
    "praia",
    "ilha",
    "vulcão",
    "arco-íris",
    "nuvem",
    "raio",
    "fogo",
    "gelo",
    "neve",
    "pizza",
    "hambúrguer",
    "sorvete",
    "bolo",
    "maçã",
    "banana",
    "uva",
    "café",
    "futebol",
    "violão",
    "piano",
    "câmera",
    "telefone",
    "computador",
    "livro",
    "lápis",
    "tesoura",
    "sapato",
    "camiseta",
    "bandeira",
    "fantasma",
    "bruxa",
    "dinossauro",
    "dragão",
    "sereia",
    "unicórnio",
    "pirata",
    "astronauta",
    "palhaço",
    "abelha",
    "coelho",
    "urso",
    "tubarão",
    "polvo",
    "caracol"
  ];


  /* =========================================================
     CORES
  ========================================================= */

  const COLORS = [
    { name:"preto", hex:"#20211D" },
    { name:"vermelho", hex:"#E23B3B" },
    { name:"laranja", hex:"#FF8A3D" },
    { name:"amarelo", hex:"#FFC53D" },
    { name:"verde", hex:"#39B36B" },
    { name:"azul", hex:"#3E8AE0" },
    { name:"rosa", hex:"#FF5C8A" },
    { name:"roxo", hex:"#B490F0" }
  ];

  const AVATAR_COLORS = [
    "#FFC53D",
    "#FF5C8A",
    "#2FD4C4",
    "#B490F0",
    "#FF8A3D",
    "#3E8AE0",
    "#39B36B",
    "#E23B3B"
  ];

  const SIZES = [
    { name:"fino", v:0.006 },
    { name:"médio", v:0.012 },
    { name:"grosso", v:0.024 }
  ];

  const ERASER_COLOR = "#FDFBF3";


  /* =========================================================
     JOGADOR
  ========================================================= */

  function uid() {

    if (
      window.crypto &&
      crypto.randomUUID
    ) {
      return crypto.randomUUID();
    }

    return "p-" +
      Math.random()
        .toString(36)
        .slice(2,10);
  }


  function hashColor(str) {

    let h = 0;

    for (
      let i = 0;
      i < str.length;
      i++
    ) {
      h =
        (h * 31 +
        str.charCodeAt(i)) >>> 0;
    }

    return AVATAR_COLORS[
      h % AVATAR_COLORS.length
    ];
  }


  function initials(name) {

    return (
      name || "?"
    )
      .trim()
      .slice(0,2)
      .toUpperCase();
  }


  function escapeHtml(s) {

    return String(s || "")
      .replace(
        /[&<>"']/g,
        function (c) {

          return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
          }[c];

        }
      );
  }


  const me = {
    id:uid(),
    name:null
  };


  /* =========================================================
     ESTADO LOCAL
  ========================================================= */

  let meta = null;
  let strokes = null;

  let metaVersionSeen = null;
  let strokesVersionSeen = null;

  let pollTimer = null;

  let transitioning = false;

  let isDrawing = false;
  let currentStroke = null;

  let activeColor = COLORS[0].hex;
  let activeSize = SIZES[1].v;

  let lastStrokeWrite = 0;
  let strokesWriteInFlight = false;

  const app =
    document.getElementById("app");


  /* =========================================================
     FIREBASE
  ========================================================= */

  async function firebaseRequest(
    path,
    options = {}
  ) {

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        8000
      );

    try {

      const response =
        await fetch(
          FIREBASE_DB_URL + path,
          {
            ...options,
            headers:{
              "Content-Type":
                "application/json",
              ...(options.headers || {})
            },
            signal:
              controller.signal
          }
        );

      if (!response.ok) {

        const text =
          await response
            .text()
            .catch(() => "");

        throw new Error(
          "Firebase HTTP " +
          response.status +
          (
            text
              ? ": " + text
              : ""
          )
        );
      }

      return await response.json();

    } catch (e) {

      if (
        e.name ===
        "AbortError"
      ) {
        throw new Error(
          "O Firebase demorou mais de 8 segundos para responder."
        );
      }

      throw e;

    } finally {

      clearTimeout(timeout);
    }
  }


  function defaultMeta() {

    return {
      players:{},

      phase:"lobby",

      round:0,

      maxRounds:0,

      drawOrder:[],

      currentDrawerId:null,

      currentWord:null,

      lastWords:[],

      roundStartAt:0,

      roundEndAt:0,

      correctGuessers:[],

      chat:[]
    };
  }


  async function readMeta() {

    const remote =
      await firebaseRequest(
        META_PATH
      );

    const base =
      defaultMeta();

    if (
      !remote ||
      typeof remote !== "object"
    ) {
      return base;
    }

    return {
      ...base,
      ...remote,

      players:
        remote.players &&
        typeof remote.players === "object"
          ? remote.players
          : {},

      drawOrder:
        Array.isArray(remote.drawOrder)
          ? remote.drawOrder
          : [],

      lastWords:
        Array.isArray(remote.lastWords)
          ? remote.lastWords
          : [],

      correctGuessers:
        Array.isArray(
          remote.correctGuessers
        )
          ? remote.correctGuessers
          : [],

      chat:
        Array.isArray(remote.chat)
          ? remote.chat
          : []
    };
  }


  async function writeMeta(next) {

    return await firebaseRequest(
      META_PATH,
      {
        method:"PUT",
        body:JSON.stringify(next)
      }
    );
  }


  async function readStrokes() {

    return await firebaseRequest(
      STROKES_PATH
    );
  }


  async function writeStrokes(next) {

    return await firebaseRequest(
      STROKES_PATH,
      {
        method:"PUT",
        body:JSON.stringify(next)
      }
    );
  }


  /* =========================================================
     JOGADORES
  ========================================================= */

  function playerIds() {

    return Object.keys(
      (meta && meta.players) || {}
    );
  }


  function sortedByJoin() {

    return playerIds()
      .sort(
        function (a,b) {

          return (
            (
              meta.players[a]
                .joinedAt || 0
            ) -
            (
              meta.players[b]
                .joinedAt || 0
            )
          );
        }
      );
  }


  function hostId() {

    const ids =
      sortedByJoin();

    return ids.length
      ? ids[0]
      : null;
  }


  function isHost() {

    return (
      me.id === hostId()
    );
  }


  function amIDrawer() {

    return !!(
      meta &&
      meta.currentDrawerId ===
      me.id
    );
  }


  function playerNameFromMeta(
    m,
    id
  ) {

    return (
      m.players &&
      m.players[id]
    )
      ? m.players[id].name
      : "???";
  }


  /* =========================================================
     PALAVRAS
  ========================================================= */

  function pickWord(avoid = []) {

    const pool =
      WORDS.filter(
        function (word) {
          return !avoid.includes(word);
        }
      );

    const list =
      pool.length
        ? pool
        : WORDS;

    return list[
      Math.floor(
        Math.random() *
        list.length
      )
    ];
  }


  /* =========================================================
     ENTRAR
  ========================================================= */

  async function joinGame(name) {

    const fresh =
      await readMeta();

    const ids =
      Object.keys(
        fresh.players || {}
      );

    if (
      !fresh.players[me.id] &&
      ids.length >= MAX_PLAYERS
    ) {

      alert(
        "A sala já está cheia. Máximo de 4 jogadores."
      );

      me.name = null;

      render();

      return;
    }


    fresh.players[me.id] = {

      name:name,

      score:
        fresh.players[me.id]?.score ||
        0,

      joinedAt:
        fresh.players[me.id]?.joinedAt ||
        Date.now()
    };


    meta =
      await writeMeta(
        fresh
      );


    metaVersionSeen =
      JSON.stringify(meta);


    render();

    startPolling();
  }


  /* =========================================================
     SAIR
  ========================================================= */

  async function leaveGame() {

    try {

      const fresh =
        await readMeta();

      if (!fresh) {
        return;
      }

      delete fresh.players[
        me.id
      ];

      fresh.drawOrder =
        (
          fresh.drawOrder || []
        ).filter(
          id => id !== me.id
        );

      if (
        fresh.currentDrawerId ===
        me.id
      ) {
        fresh.currentDrawerId =
          null;
      }

      await writeMeta(
        fresh
      );

    } catch (e) {

      console.error(
        "Erro ao sair:",
        e
      );

    } finally {

      me.name = null;
      meta = null;
      strokes = null;

      render();
    }
  }


  /* =========================================================
     INICIAR JOGO
     SOMENTE O HOST
  ========================================================= */

  async function startGame() {

    if (!isHost()) {
      return;
    }

    if (transitioning) {
      return;
    }

    transitioning = true;

    try {

      const fresh =
        await readMeta();

      const ids =
        Object.keys(
          fresh.players || {}
        );

      if (ids.length < 2) {

        alert(
          "É necessário pelo menos 2 jogadores."
        );

        return;
      }

      if (ids.length > MAX_PLAYERS) {

        alert(
          "O jogo permite no máximo 4 jogadores."
        );

        return;
      }


      const order =
        ids.slice().sort(
          () =>
            Math.random() - 0.5
        );


      const word =
        pickWord([]);


      /*
       * IMPORTANTE:
       * A palavra é escolhida UMA ÚNICA VEZ.
       * Todos os jogadores recebem esta mesma
       * informação através de meta.currentWord.
       */

      fresh.phase =
        "playing";

      fresh.round =
        1;

      fresh.maxRounds =
        order.length * 2;

      fresh.drawOrder =
        order;

      fresh.currentDrawerId =
        order[0];

      fresh.currentWord =
        word;

      fresh.lastWords =
        [word];

      fresh.roundStartAt =
        Date.now();

      fresh.roundEndAt =
        0;

      fresh.correctGuessers =
        [];

      fresh.chat = [
        {
          system:true,
          text:
            "Rodada 1: " +
            playerNameFromMeta(
              fresh,
              order[0]
            ) +
            " vai desenhar!",
          ts:Date.now()
        }
      ];


      Object.values(
        fresh.players
      ).forEach(
        function (p) {
          p.score = 0;
        }
      );


      await writeStrokes({
        round:1,
        strokes:[],
        drawerId:order[0]
      });


      await writeMeta(
        fresh
      );


      meta = fresh;

      strokes = {
        round:1,
        strokes:[],
        drawerId:order[0]
      };

      metaVersionSeen =
        JSON.stringify(meta);

      strokesVersionSeen =
        JSON.stringify(
          strokes.strokes
        );

      render();

    } catch (e) {

      console.error(
        "Erro ao iniciar:",
        e
      );

      alert(
        "Não foi possível iniciar a partida."
      );

    } finally {

      transitioning = false;
    }
  }


  /* =========================================================
     FINALIZAR RODADA
     SOMENTE O HOST
  ========================================================= */

  async function endRoundNow(
    reason
  ) {

    /*
     * ESTA É UMA DAS CORREÇÕES PRINCIPAIS.
     *
     * Antes, todos os jogadores podiam executar
     * esta função ao mesmo tempo.
     *
     * Agora somente o host pode alterar a fase.
     */

    if (!isHost()) {
      return;
    }

    if (transitioning) {
      return;
    }

    transitioning = true;

    try {

      const fresh =
        await readMeta();

      if (
        !fresh ||
        fresh.phase !== "playing"
      ) {
        return;
      }


      /*
       * Não escolhemos uma nova palavra aqui.
       *
       * currentWord continua sendo exatamente
       * a palavra daquela rodada.
       */

      fresh.phase =
        "round-end";

      fresh.roundEndAt =
        Date.now() +
        ROUND_END_PAUSE * 1000;


      fresh.chat =
        (
          fresh.chat || []
        )
          .concat([
            {
              system:true,
              text:reason,
              ts:Date.now()
            }
          ])
          .slice(-40);


      await writeMeta(
        fresh
      );


      meta =
        fresh;

      metaVersionSeen =
        JSON.stringify(meta);

      render();

    } catch (e) {

      console.error(
        "Erro ao finalizar rodada:",
        e
      );

    } finally {

      transitioning = false;
    }
  }


  /* =========================================================
     PRÓXIMA RODADA
     SOMENTE O HOST
  ========================================================= */

  async function advanceRound() {

    /*
     * SOMENTE O HOST pode avançar.
     * Isso impede que 2, 3 ou 4 navegadores
     * escolham palavras diferentes.
     */

    if (!isHost()) {
      return;
    }

    if (transitioning) {
      return;
    }

    transitioning = true;

    try {

      const fresh =
        await readMeta();

      if (
        !fresh ||
        fresh.phase !== "round-end"
      ) {
        return;
      }


      const nextRound =
        (fresh.round || 0) + 1;


      /*
       * Se acabou o número de rodadas,
       * termina o jogo.
       */

      if (
        nextRound >
        fresh.maxRounds
      ) {

        fresh.phase =
          "game-end";

        fresh.roundEndAt =
          0;

        await writeMeta(
          fresh
        );

        meta =
          fresh;

        render();

        return;
      }


      const order =
        fresh.drawOrder || [];


      if (!order.length) {
        return;
      }


      /*
       * A ordem é fixa durante a partida.
       *
       * Rodada:
       * 1 -> jogador 1
       * 2 -> jogador 2
       * 3 -> jogador 3
       * ...
       * depois volta para jogador 1.
       */

      const nextDrawer =
        order[
          (nextRound - 1) %
          order.length
        ];


      /*
       * A NOVA palavra é criada somente aqui,
       * uma vez, pelo host.
       */

      const word =
        pickWord(
          (
            fresh.lastWords || []
          ).slice(-6)
        );


      fresh.phase =
        "playing";

      fresh.round =
        nextRound;

      fresh.currentDrawerId =
        nextDrawer;

      fresh.currentWord =
        word;

      fresh.lastWords =
        (
          fresh.lastWords || []
        )
          .concat([word])
          .slice(-8);

      fresh.roundStartAt =
        Date.now();

      fresh.roundEndAt =
        0;

      fresh.correctGuessers =
        [];


      fresh.chat =
        (
          fresh.chat || []
        )
          .concat([
            {
              system:true,
              text:
                "Rodada " +
                nextRound +
                ": " +
                playerNameFromMeta(
                  fresh,
                  nextDrawer
                ) +
                " vai desenhar!",
              ts:Date.now()
            }
          ])
          .slice(-40);


      /*
       * Primeiro limpamos o quadro.
       */

      await writeStrokes({
        round:nextRound,
        strokes:[],
        drawerId:nextDrawer
      });


      /*
       * Depois publicamos o estado da nova rodada.
       */

      await writeMeta(
        fresh
      );


      meta =
        fresh;

      strokes = {
        round:nextRound,
        strokes:[],
        drawerId:nextDrawer
      };

      metaVersionSeen =
        JSON.stringify(meta);

      strokesVersionSeen =
        JSON.stringify(
          strokes.strokes
        );

      render();

    } catch (e) {

      console.error(
        "Erro ao avançar rodada:",
        e
      );

    } finally {

      transitioning = false;
    }
  }


  /* =========================================================
     JOGAR NOVAMENTE
     SOMENTE O HOST
  ========================================================= */

  async function playAgain() {

    if (!isHost()) {
      return;
    }

    if (transitioning) {
      return;
    }

    transitioning = true;

    try {

      const fresh =
        await readMeta();

      if (!fresh) {
        return;
      }


      /*
       * Volta ao lobby.
       * Os mesmos jogadores continuam na sala.
       */

      fresh.phase =
        "lobby";

      fresh.round =
        0;

      fresh.maxRounds =
        0;

      fresh.drawOrder =
        [];

      fresh.currentDrawerId =
        null;

      fresh.currentWord =
        null;

      fresh.lastWords =
        [];

      fresh.roundStartAt =
        0;

      fresh.roundEndAt =
        0;

      fresh.correctGuessers =
        [];

      fresh.chat =
        [];


      Object.values(
        fresh.players || {}
      ).forEach(
        function (p) {
          p.score = 0;
        }
      );


      /*
       * Limpa o desenho.
       */

      await writeStrokes({
        round:0,
        strokes:[],
        drawerId:null
      });


      await writeMeta(
        fresh
      );


      meta =
        fresh;

      strokes = {
        round:0,
        strokes:[],
        drawerId:null
      };

      metaVersionSeen =
        JSON.stringify(meta);

      strokesVersionSeen =
        JSON.stringify(
          strokes.strokes
        );

      render();

    } catch (e) {

      console.error(
        "Erro ao reiniciar:",
        e
      );

      alert(
        "Não foi possível reiniciar a partida."
      );

    } finally {

      transitioning = false;
    }
  }


  /* =========================================================
     PALPITE
  ========================================================= */

  async function sendGuess(text) {

    text =
      text.trim();

    if (!text) {
      return;
    }


    const fresh =
      await readMeta();


    if (
      !fresh ||
      fresh.phase !== "playing"
    ) {
      return;
    }


    /*
     * Desenhista não pode adivinhar.
     */

    if (
      fresh.currentDrawerId ===
      me.id
    ) {
      return;
    }


    /*
     * Quem já acertou não pode mandar
     * mais palpites.
     */

    if (
      (
        fresh.correctGuessers || []
      ).includes(me.id)
    ) {
      return;
    }


    const normalizedText =
      text
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );


    const normalizedWord =
      (
        fresh.currentWord || ""
      )
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );


    const isCorrect =
      normalizedText ===
      normalizedWord;


    const myName =
      fresh.players?.[me.id]?.name ||
      "Alguém";


    if (isCorrect) {

      const elapsed =
        (
          Date.now() -
          fresh.roundStartAt
        ) / 1000;


      const remaining =
        Math.max(
          0,
          ROUND_DURATION -
          elapsed
        );


      const pts =
        Math.max(
          15,
          Math.round(
            100 *
            (
              remaining /
              ROUND_DURATION
            )
          )
        );


      if (
        !fresh.players[me.id]
      ) {
        return;
      }


      fresh.players[me.id].score =
        (
          fresh.players[me.id].score ||
          0
        ) + pts;


      if (
        fresh.players[
          fresh.currentDrawerId
        ]
      ) {

        fresh.players[
          fresh.currentDrawerId
        ].score =
          (
            fresh.players[
              fresh.currentDrawerId
            ].score || 0
          ) +
          Math.round(
            pts / 2
          );
      }


      fresh.correctGuessers =
        (
          fresh.correctGuessers || []
        ).concat([me.id]);


      fresh.chat =
        (
          fresh.chat || []
        )
          .concat([
            {
              correct:true,
              text:
                "🎉 " +
                myName +
                " acertou!",
              ts:Date.now()
            }
          ])
          .slice(-40);

    } else {

      fresh.chat =
        (
          fresh.chat || []
        )
          .concat([
            {
              playerId:me.id,
              who:myName,
              text:text,
              ts:Date.now()
            }
          ])
          .slice(-40);
    }


    await writeMeta(
      fresh
    );


    meta =
      fresh;

    metaVersionSeen =
      JSON.stringify(meta);

    render();


    /*
     * Se todos os jogadores que não desenham
     * acertaram, o host encerra a rodada.
     */

    if (isCorrect) {

      const nonDrawers =
        Object.keys(
          fresh.players || {}
        ).filter(
          id =>
            id !==
            fresh.currentDrawerId
        );


      const allCorrect =
        nonDrawers.length > 0 &&
        nonDrawers.every(
          id =>
            (
              fresh.correctGuessers || []
            ).includes(id)
        );


      if (allCorrect) {

        if (isHost()) {

          await endRoundNow(
            "Todo mundo acertou! 🎉"
          );

        }
      }
    }
  }


  /* =========================================================
     POLLING
  ========================================================= */

  function startPolling() {

    if (pollTimer) {
      return;
    }

    pollTimer =
      setInterval(
        pollTick,
        POLL_MS
      );
  }


  async function pollTick() {

    try {

      const [
        m,
        s
      ] = await Promise.all([
        readMeta(),
        readStrokes()
      ]);


      let changed = false;


      if (m) {

        const v =
          JSON.stringify(m);

        if (
          v !==
          metaVersionSeen
        ) {

          metaVersionSeen =
            v;

          meta =
            m;

          changed = true;
        }
      }


      if (s) {

        const v =
          JSON.stringify(
            s.strokes || []
          );


        if (
          v !==
          strokesVersionSeen
        ) {

          strokesVersionSeen =
            v;

          strokes =
            s;

          changed = true;

          drawAllStrokes();
        }
      }


      if (changed) {
        render();
      }


      checkTimers();

    } catch (e) {

      console.error(
        "Erro no polling:",
        e
      );
    }
  }


  /* =========================================================
     TIMER
  ========================================================= */

  function checkTimers() {

    if (!meta) {
      return;
    }


    const now =
      Date.now();


    if (
      meta.phase ===
      "playing"
    ) {

      const remaining =
        (
          meta.roundStartAt +
          ROUND_DURATION * 1000
        ) - now;


      /*
       * IMPORTANTE:
       * somente o host pode finalizar.
       */

      if (
        remaining <= 0 &&
        isHost()
      ) {

        endRoundNow(
          "Tempo esgotado!"
        );
      }

    } else if (
      meta.phase ===
      "round-end"
    ) {

      /*
       * somente o host pode avançar.
       */

      if (
        meta.roundEndAt &&
        now >=
        meta.roundEndAt &&
        isHost()
      ) {

        advanceRound();
      }
    }


    updateTimerDisplay();
  }


  function updateTimerDisplay() {

    const el =
      document.getElementById(
        "timer-val"
      );


    if (
      !el ||
      !meta ||
      meta.phase !==
      "playing"
    ) {
      return;
    }


    const remaining =
      Math.max(
        0,
        Math.ceil(
          (
            meta.roundStartAt +
            ROUND_DURATION * 1000 -
            Date.now()
          ) / 1000
        )
      );


    el.textContent =
      remaining;


    if (el.parentElement) {

      el.parentElement
        .classList
        .toggle(
          "low",
          remaining <= 12
        );
    }
  }


  setInterval(
    function () {

      if (
        meta &&
        meta.phase ===
        "playing"
      ) {
        updateTimerDisplay();
      }

    },
    1000
  );


  /* =========================================================
     CANVAS
  ========================================================= */

  function getCanvas() {

    return document.getElementById(
      "board"
    );
  }


  function canvasPos(
    evt,
    canvas
  ) {

    const rect =
      canvas.getBoundingClientRect();


    const cx =
      evt.touches
        ? evt.touches[0].clientX
        : evt.clientX;


    const cy =
      evt.touches
        ? evt.touches[0].clientY
        : evt.clientY;


    let x =
      (cx - rect.left) /
      rect.width;


    let y =
      (cy - rect.top) /
      rect.height;


    x =
      Math.min(
        1,
        Math.max(
          0,
          x
        )
      );


    y =
      Math.min(
        1,
        Math.max(
          0,
          y
        )
      );


    return {
      x:x,
      y:y
    };
  }


  function drawAllStrokes() {

    const canvas =
      getCanvas();


    if (!canvas) {
      return;
    }


    const ctx =
      canvas.getContext(
        "2d"
      );


    const W =
      canvas.width;

    const H =
      canvas.height;


    ctx.clearRect(
      0,
      0,
      W,
      H
    );


    ctx.fillStyle =
      ERASER_COLOR;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    const list =
      (
        strokes &&
        strokes.strokes
      ) || [];


    list.forEach(
      function (st) {

        if (
          !st.points ||
          !st.points.length
        ) {
          return;
        }


        ctx.beginPath();

        ctx.lineJoin =
          "round";

        ctx.lineCap =
          "round";

        ctx.strokeStyle =
          st.color;

        ctx.lineWidth =
          Math.max(
            1,
            st.size * W
          );


        ctx.moveTo(
          st.points[0].x * W,
          st.points[0].y * H
        );


        if (
          st.points.length === 1
        ) {

          ctx.lineTo(
            st.points[0].x * W + .1,
            st.points[0].y * H
          );

        } else {

          for (
            let i = 1;
            i < st.points.length;
            i++
          ) {

            ctx.lineTo(
              st.points[i].x * W,
              st.points[i].y * H
            );
          }
        }


        ctx.stroke();
      }
    );
  }


  function resizeCanvasBacking() {

    const canvas =
      getCanvas();


    if (!canvas) {
      return;
    }


    canvas.width =
      700;

    canvas.height =
      440;


    drawAllStrokes();
  }


  /* =========================================================
     DESENHO
  ========================================================= */

  function setupCanvasEvents() {

    const canvas =
      getCanvas();


    if (!canvas) {
      return;
    }


    const start =
      function (e) {

        if (
          !amIDrawer() ||
          !meta ||
          meta.phase !==
          "playing"
        ) {
          return;
        }


        e.preventDefault();


        isDrawing =
          true;


        const p =
          canvasPos(
            e,
            canvas
          );


        currentStroke = {

          color:
            activeColor,

          size:
            activeSize,

          points:[p]
        };


        if (
          !strokes ||
          strokes.round !==
          meta.round
        ) {

          strokes = {

            round:
              meta.round,

            strokes:[],

            drawerId:
              me.id
          };
        }


        strokes.strokes =
          (
            strokes.strokes || []
          ).concat([
            currentStroke
          ]);


        drawAllStrokes();
      };


    const move =
      function (e) {

        if (
          !isDrawing ||
          !currentStroke
        ) {
          return;
        }


        e.preventDefault();


        const p =
          canvasPos(
            e,
            canvas
          );


        currentStroke.points.push(
          p
        );


        drawAllStrokes();


        const now =
          Date.now();


        if (
          now -
          lastStrokeWrite >
          110 &&
          !strokesWriteInFlight
        ) {

          lastStrokeWrite =
            now;

          flushStrokes();
        }
      };


    const end =
      function () {

        if (!isDrawing) {
          return;
        }


        isDrawing =
          false;

        currentStroke =
          null;

        flushStrokes();
      };


    canvas.addEventListener(
      "mousedown",
      start
    );

    canvas.addEventListener(
      "mousemove",
      move
    );

    window.addEventListener(
      "mouseup",
      end
    );


    canvas.addEventListener(
      "touchstart",
      start,
      { passive:false }
    );

    canvas.addEventListener(
      "touchmove",
      move,
      { passive:false }
    );

    canvas.addEventListener(
      "touchend",
      end
    );
  }


  async function flushStrokes() {

    if (
      !strokes ||
      !amIDrawer()
    ) {
      return;
    }


    strokesWriteInFlight =
      true;


    try {

      await writeStrokes({
        round:
          strokes.round,

        strokes:
          strokes.strokes,

        drawerId:
          me.id
      });


      strokesVersionSeen =
        JSON.stringify(
          strokes.strokes || []
        );

    } catch (e) {

      console.error(
        "Erro ao salvar desenho:",
        e
      );

    } finally {

      strokesWriteInFlight =
        false;
    }
  }


  async function clearCanvas() {

    if (!amIDrawer()) {
      return;
    }


    strokes = {

      round:
        meta.round,

      strokes:[],

      drawerId:
        me.id
    };


    drawAllStrokes();


    await writeStrokes(
      strokes
    );
  }


  /* =========================================================
     FRAME
  ========================================================= */

  function wobbleFrame() {

    return `
      <svg
        class="wobble"
        viewBox="0 0 700 440"
        preserveAspectRatio="none"
      >
        <rect
          x="4"
          y="4"
          width="692"
          height="432"
          rx="10"
          fill="none"
          stroke="#FFC53D"
          stroke-width="3"
          opacity=".55"
        />
      </svg>
    `;
  }


  /* =========================================================
     RENDER
  ========================================================= */

  function render() {

    if (!me.name) {
      renderLanding();
      return;
    }


    if (!meta) {
      renderLanding();
      return;
    }


    switch (
      meta.phase
    ) {

      case "lobby":
        renderLobby();
        break;

      case "playing":
        renderPlaying();
        break;

      case "round-end":
        renderRoundEnd();
        break;

      case "game-end":
        renderGameEnd();
        break;

      default:
        renderLobby();
    }
  }

          </button>

        </div>

      </div>
    `;

      document.getElementById(
        "name-input"
      );


    const btn =
      document.getElementById(
        "join-btn"
      );

      const name =
        input.value.trim();


      if (!name) {

        input.focus();

        return;
      }


      btn.disabled =
        true;

      btn.textContent =
        "Entrando...";

      } catch (e) {

      start.addEventListener(
        "click",
        startGame
      );
    }


    const leave =
      document.getElementById(
        "leave-btn"
      );


    if (leave) {

      leave.addEventListener(
        "click",
        leaveGame
      );
    }
  }


  /* =========================================================
     PLACAR
  ========================================================= */

  function scoreboardHtml() {

    const ids =
      playerIds()
        .slice()
        .sort(
          function (a,b) {

            return (
              (
                meta.players[b]
                  .score || 0
              ) -
              (
                meta.players[a]
                  .score || 0
              )
            );
          }
        );


    return `

      <div class="scoreboard">

        ${
          ids.map(
            function (id) {

              const p =
                meta.players[id];


              const color =
                hashColor(id);


              const drawing =
                meta.currentDrawerId ===
                id;


              return `

                <div
                  class="
                    score-row
                    ${drawing ? "drawing" : ""}
                  "
                >

                  <div
                    class="avatar"
                    style="
                      background:${color};
                      width:22px;
                      height:22px;
                      font-size:11px;
                    "
                  >
                    ${escapeHtml(
                      initials(p.name)
                    )}
                  </div>

                  <div class="name">

                    ${escapeHtml(p.name)}

                    ${
                      id === me.id
                        ? " (você)"
                        : ""
                    }

                    ${
                      drawing
                        ? " ✏️"
                        : ""
                    }

                  </div>

                  <div class="pts">
                    ${p.score || 0}
                  </div>

                </div>
              `;
            }
          ).join("")
        }

      </div>
    `;
  }


  /* =========================================================
     CHAT
  ========================================================= */

  function chatHtml() {

    return (
      meta.chat || []
    )
      .map(
        function (m) {

          if (m.system) {

            return `
              <div class="chat-msg system">
                ${escapeHtml(m.text)}
              </div>
            `;
          }


          if (m.correct) {

            return `
              <div class="chat-msg correct">
                ${escapeHtml(m.text)}
              </div>
            `;
          }


          return `
            <div class="chat-msg">

              <span class="who">
                ${escapeHtml(m.who)}:
              </span>

              ${escapeHtml(m.text)}

            </div>
          `;
        }
      )
      .join("");
  }


  /* =========================================================
     JOGO
  ========================================================= */

  function renderPlaying() {

    const drawer =
      amIDrawer();


    const drawerName =
      meta.players[
        meta.currentDrawerId
      ]?.name ||
      "???";


    const remaining =
      Math.max(
        0,
        Math.ceil(
          (
            meta.roundStartAt +
            ROUND_DURATION * 1000 -
            Date.now()
          ) / 1000
        )
      );


    const alreadyCorrect =
      (
        meta.correctGuessers || []
      ).includes(
        me.id
      );


    /*
     * SOMENTE o desenhista vê currentWord.
     *
     * Os outros veem somente os espaços.
     */

    let wordDisplay;


    if (drawer) {

      wordDisplay =
        meta.currentWord || "";

    } else {

      wordDisplay =
        (
          meta.currentWord || ""
        )
          .split("")
          .map(
            function (ch) {

              return ch === " "
                ? "  "
                : "_";
            }
          )
          .join(" ");
    }


    app.innerHTML = `

      <div class="game-top">

        <div class="round-info">

          Rodada
          <b>${meta.round}</b>

          de

          <b>${meta.maxRounds}</b>

          ·

          ${
            drawer
              ? "Sua vez de desenhar!"
              : escapeHtml(
                  drawerName
                ) +
                " está desenhando"
          }

        </div>

        <div class="timer">

          <span id="timer-val">
            ${remaining}
          </span>

          s

        </div>

      </div>


      <div
        class="
          word-banner
          ${drawer ? "drawer" : ""}
        "
      >
        ${escapeHtml(
          wordDisplay
        )}
      </div>


      <div class="play-area">

        <div class="canvas-col">

          <div
            class="card"
            style="padding:12px;"
          >

            <div class="canvas-frame">

              ${wobbleFrame()}

              <canvas
                id="board"
                width="700"
                height="440"
              ></canvas>

            </div>


            ${
              drawer

                ? `

                  <div class="tools">

                    ${
                      COLORS.map(
                        function (c) {

                          return `

                            <div
                              class="
                                swatch
                                ${
                                  c.hex ===
                                  activeColor
                                    ? "active"
                                    : ""
                                }
                              "
                              data-color="${c.hex}"
                              style="
                                background:${c.hex}
                              "
                              title="${c.name}"
                            ></div>

                          `;
                        }
                      ).join("")
                    }


                    <div
                      style="
                        width:1px;
                        height:22px;
                        background:var(--line);
                        margin:0 4px;
                      "
                    ></div>


                    ${
                      SIZES.map(
                        function (s) {

                          const size =
                            10 +
                            s.v * 300;


                          return `

                            <div
                              class="
                                size-dot
                                ${
                                  s.v ===
                                  activeSize
                                    ? "active"
                                    : ""
                                }
                              "
                              data-size="${s.v}"
                              style="
                                width:${size}px;
                                height:${size}px;
                              "
                              title="${s.name}"
                            ></div>

                          `;
                        }
                      ).join("")
                    }


                    <div
                      style="flex:1"
                    ></div>


                    <button
                      class="secondary"
                      id="clear-btn"
                    >
                      Limpar
                    </button>

                  </div>

                `

                : `

                  <p class="hint">
                    Só quem está desenhando
                    pode usar o quadro.
                    Tente adivinhar no chat! →
                  </p>

                `
            }

          </div>

        </div>


        <div class="side-col">

          <div
            class="card"
            style="padding:12px;"
          >

            <h3
              style="
                margin:0 0 8px;
                font-size:15px;
              "
            >
              Placar
            </h3>

            ${scoreboardHtml()}

          </div>


          <div class="chat">

            <div
              class="chat-log"
              id="chat-log"
            >
              ${chatHtml()}
            </div>


            ${
              drawer

                ? `

                  <p
                    class="hint"
                    style="margin:8px 0 0;"
                  >
                    Você está desenhando —
                    não pode enviar palpites.
                  </p>

                `

                : alreadyCorrect

                  ? `

                    <p
                      class="hint"
                      style="margin:8px 0 0;"
                    >
                      Você acertou!
                      Aguarde a próxima rodada. 🎉
                    </p>

                  `

                  : `

                    <div class="chat-form">

                      <input
                        type="text"
                        id="guess-input"
                        placeholder="Digite seu palpite..."
                        maxlength="40"
                        autocomplete="off"
                      />

                      <button id="guess-btn">
                        Enviar
                      </button>

                    </div>

                  `
            }

          </div>

        </div>

      </div>
    `;


    resizeCanvasBacking();

    setupCanvasEvents();


    if (drawer) {

      document
        .querySelectorAll(
          ".swatch"
        )
        .forEach(
          function (el) {

            el.addEventListener(
              "click",
              function () {

                activeColor =
                  el.dataset.color;

                render();
              }
            );
          }
        );


      document
        .querySelectorAll(
          ".size-dot"
        )
        .forEach(
          function (el) {

            el.addEventListener(
              "click",
              function () {

                activeSize =
                  parseFloat(
                    el.dataset.size
                  );

                render();
              }
            );
          }
        );


      document
        .getElementById(
          "clear-btn"
        )
        .addEventListener(
          "click",
          clearCanvas
        );

    } else if (
      !alreadyCorrect
    ) {

      const input =
        document.getElementById(
          "guess-input"
        );


      const btn =
        document.getElementById(
          "guess-btn"
        );


      function go() {

        const value =
          input.value;

        input.value =
          "";

        sendGuess(
          value
        );
      }


      btn.addEventListener(
        "click",
        go
      );


      input.addEventListener(
        "keydown",
        function (e) {

          if (
            e.key ===
            "Enter"
          ) {
            go();
          }
        }
      );
    }


    const log =
      document.getElementById(
        "chat-log"
      );


    if (log) {

      log.scrollTop =
        log.scrollHeight;
    }
  }


  /* =========================================================
     FIM DA RODADA
  ========================================================= */

  function renderRoundEnd() {

    /*
     * Aqui todos podem ver a palavra.
     *
     * E ela é exatamente meta.currentWord,
     * que foi criada no início daquela rodada.
     */

    app.innerHTML = `

      <div class="card reveal">

        <div class="hint">
          A palavra era
        </div>

        <div class="w">
          ${escapeHtml(
            meta.currentWord || ""
          )}
        </div>

        <div class="sub">
          Próxima rodada em instantes...
        </div>

      </div>


      <div
        class="card"
        style="padding:12px;"
      >

        <h3
          style="
            margin:0 0 8px;
            font-size:15px;
          "
        >
          Placar
        </h3>

        ${scoreboardHtml()}

      </div>
    `;
  }


  /* =========================================================
     FIM DO JOGO
  ========================================================= */

  function renderGameEnd() {

    const ids =
      playerIds()
        .slice()
        .sort(
          function (a,b) {

            return (
              (
                meta.players[b]
                  .score || 0
              ) -
              (
                meta.players[a]
                  .score || 0
              )
            );
          }
        );


    const winner =
      ids[0]
        ? meta.players[ids[0]]
        : null;


    app.innerHTML = `

      <div
        class="card winner-banner"
      >

        <div class="hint">
          Fim de jogo!
        </div>

        <div class="w">

          ${
            winner
              ? "🏆 " +
                escapeHtml(
                  winner.name
                ) +
                " venceu!"
              : ""
          }

        </div>

      </div>


      <div
        class="card"
        style="padding:12px;"
      >

        <h3
          style="
            margin:0 0 8px;
            font-size:15px;
          "
        >
          Placar final
        </h3>

        ${scoreboardHtml()}

      </div>


      <div class="join-row">

        ${
          isHost()

            ? `

              <button id="again-btn">
                Jogar novamente
              </button>

            `

            : `

              <span class="hint">
                Aguardando o anfitrião
                reiniciar...
              </span>

            `
        }


        <button
          class="secondary"
          id="leave-btn2"
        >
          Sair
        </button>

      </div>
    `;


    const again =
      document.getElementById(
        "again-btn"
      );


    if (again) {

      again.addEventListener(
        "click",
        playAgain
      );
    }


    const leave =
      document.getElementById(
        "leave-btn2"
      );


    if (leave) {

      leave.addEventListener(
        "click",
        leaveGame
      );
    }
  }


  /* =========================================================
     BOOT
  ========================================================= */

  async function boot() {

    try {

      meta =
        await readMeta();

      if (!meta) {
        meta =
          defaultMeta();
      }


      metaVersionSeen =
        JSON.stringify(meta);


      strokes =
        await readStrokes();


      if (strokes) {

        strokesVersionSeen =
          JSON.stringify(
            strokes.strokes || []
          );
      }


      render();

      startPolling();

    } catch (e) {

      console.error(
        "Erro ao iniciar:",
        e
      );


      meta =
        defaultMeta();


      renderLanding();


      const box =
        document.querySelector(
          ".status-box"
        );


      if (box) {

        box.innerHTML =
          "⚠️ Não foi possível conectar ao Firebase.";
      }
    }
  }


  boot();

})();
</script>

</body>
</html>
