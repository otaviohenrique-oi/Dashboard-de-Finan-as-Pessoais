<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desenha & Adivinha</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap');

:root {
  --bg:#16232C;
  --bg-2:#1F323D;
  --bg-3:#263F4C;
  --canvas-bg:#FDFBF3;
  --ink:#EDEAE0;
  --ink-dim:#9FB2BA;
  --yellow:#FFC53D;
  --pink:#FF5C8A;
  --teal:#2FD4C4;
  --purple:#B490F0;
  --line:rgba(255,255,255,.10);
  --radius:14px;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  padding:0;
}

body {
  background:radial-gradient(circle at 20% -10%,#223744 0%,var(--bg) 55%);
  color:var(--ink);
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh;
  padding:20px 14px 60px;
}

h1,h2,h3,.marker {
  font-family:'Kalam',cursive;
}

.wrap {
  max-width:1100px;
  margin:0 auto;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.brand .dot {
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--pink);
  box-shadow:18px 0 0 var(--yellow),36px 0 0 var(--teal);
  margin-right:36px;
}

.brand h1 {
  font-size:30px;
  margin:0;
  letter-spacing:.5px;
}

.brand p {
  margin:2px 0 0;
  color:var(--ink-dim);
  font-size:13px;
}

.card {
  background:var(--bg-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:16px;
}

.join-row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

input[type="text"] {
  flex:1;
  min-width:180px;
  background:var(--bg-3);
  border:1px solid var(--line);
  color:var(--ink);
  padding:12px 14px;
  border-radius:10px;
  font-size:15px;
  font-family:inherit;
}

input[type="text"]:focus {
  outline:2px solid var(--teal);
}

button {
  font-family:'Kalam',cursive;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:10px;
  padding:11px 20px;
  cursor:pointer;
  background:var(--yellow);
  color:#22160A;
  transition:transform .12s ease,opacity .12s ease;
}

button:hover:not(:disabled) {
  transform:translateY(-1px);
}

button:active:not(:disabled) {
  transform:translateY(0) scale(.98);
}

button:disabled {
  opacity:.4;
  cursor:not-allowed;
}

button.secondary {
  background:var(--bg-3);
  color:var(--ink);
  border:1px solid var(--line);
}

button.pink {
  background:var(--pink);
  color:#2A0A16;
}

button.teal {
  background:var(--teal);
  color:#052824;
}

button.danger {
  background:#E23B3B;
  color:white;
}

.player-list {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:16px;
}

.chip {
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg-3);
  border:1px solid var(--line);
  padding:7px 12px 7px 7px;
  border-radius:999px;
  font-size:14px;
}

.avatar {
  width:26px;
  height:26px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Kalam',cursive;
  font-weight:700;
  font-size:13px;
  color:#1a1a1a;
  flex-shrink:0;
}

.host-badge {
  font-size:10px;
  color:var(--yellow);
  margin-left:2px;
}

.kick-btn {
  font-family:'Space Grotesk',sans-serif;
  font-size:11px;
  padding:4px 8px;
  border-radius:7px;
  background:#6b2737;
  color:white;
}

.hint {
  color:var(--ink-dim);
  font-size:13px;
  margin-top:10px;
  line-height:1.5;
}

.game-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
}

.round-info {
  font-size:14px;
  color:var(--ink-dim);
}

.round-info b {
  color:var(--ink);
}

.timer {
  font-family:'Kalam',cursive;
  font-size:26px;
  font-weight:700;
  background:var(--bg-3);
  border:1px solid var(--line);
  padding:4px 16px;
  border-radius:10px;
  min-width:90px;
  text-align:center;
}

.timer.low {
  color:var(--pink);
}

.word-banner {
  text-align:center;
  font-family:'Kalam',cursive;
  font-size:22px;
  letter-spacing:4px;
  padding:10px;
  margin-bottom:14px;
  border-radius:10px;
  background:var(--bg-3);
  border:1px solid var(--line);
}

.word-banner.drawer {
  color:var(--yellow);
  letter-spacing:1px;
}

.play-area {
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  align-items:flex-start;
}

.canvas-col {
  flex:2 1 520px;
  min-width:300px;
}

.side-col {
  flex:1 1 280px;
  min-width:240px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.canvas-frame {
  position:relative;
  padding:10px;
}

.canvas-frame svg.wobble {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

canvas {
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:700 / 440;
  background:var(--canvas-bg);
  border-radius:8px;
  touch-action:none;
  cursor:crosshair;
  position:relative;
  z-index:1;
}

.tools {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.swatch {
  width:28px;
  height:28px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
  flex-shrink:0;
}

.swatch.active {
  border-color:var(--ink);
  transform:scale(1.12);
}

.size-dot {
  border-radius:50%;
  background:var(--ink);
  cursor:pointer;
  border:2px solid transparent;
  flex-shrink:0;
}

.size-dot.active {
  border-color:var(--yellow);
}

.tool-btn {
  min-width:42px;
  padding:8px 10px;
  font-size:14px;
}

.tool-btn.active {
  outline:2px solid var(--teal);
  background:#31525e;
}

.scoreboard {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.score-row {
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg-3);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  font-size:14px;
}

.score-row .name {
  flex:1;
}

.score-row .pts {
  font-family:'Kalam',cursive;
  font-weight:700;
  color:var(--yellow);
}

.score-row.drawing {
  outline:1px solid var(--teal);
}

.chat {
  background:var(--bg-3);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  height:260px;
  display:flex;
  flex-direction:column;
}

.chat-log {
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:6px;
  padding-right:4px;
}

.chat-msg {
  font-size:13.5px;
  line-height:1.4;
  word-break:break-word;
}

.chat-msg .who {
  font-weight:700;
}

.chat-msg.correct {
  color:var(--teal);
  font-family:'Kalam',cursive;
  font-size:14.5px;
}

.chat-msg.system {
  color:var(--ink-dim);
  font-style:italic;
}

.chat-form {
  display:flex;
  gap:6px;
  margin-top:8px;
}

.chat-form input {
  padding:9px 10px;
  font-size:13.5px;
}

.chat-form button {
  padding:9px 14px;
  font-size:13.5px;
}

.reveal {
  text-align:center;
  padding:26px 10px;
}

.reveal .w {
  font-family:'Kalam',cursive;
  font-size:34px;
  color:var(--yellow);
  margin:6px 0 2px;
}

.reveal .sub {
  color:var(--ink-dim);
  font-size:14px;
}

.winner-banner {
  text-align:center;
  padding:10px 0 20px;
}

.winner-banner .w {
  font-family:'Kalam',cursive;
  font-size:30px;
  color:var(--yellow);
}

.status-box {
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  background:rgba(47,212,196,.08);
  border:1px solid rgba(47,212,196,.18);
  color:var(--ink-dim);
  font-size:13px;
}

.admin-box {
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  background:rgba(255,197,61,.06);
  border:1px solid rgba(255,197,61,.16);
}

.admin-title {
  color:var(--yellow);
  font-family:'Kalam',cursive;
  font-size:18px;
  margin-bottom:8px;
}

@media(max-width:640px) {
  .brand h1 {
    font-size:24px;
  }

  .word-banner {
    font-size:18px;
    letter-spacing:2px;
  }

  .card {
    padding:16px;
  }

  .canvas-col {
    min-width:100%;
  }
}
</style>

</head>

  </div>

<script>
(function () {

  /* =========================================================
     CONFIGURAÇÃO
  ========================================================= */

  const FIREBASE_DB_URL =
    "https://desenha-e-adivinha-19968-default-rtdb.firebaseio.com";

  const META_PATH = "/game/meta.json";
  const STROKES_PATH = "/game/strokes.json";
  const CHAT_PATH = "/game/chat.json";
  const GUESSES_PATH = "/game/correctGuessers.json";

  const POLL_MS = 900;

  // 5 MINUTOS
  const ROUND_DURATION = 300;

  const ROUND_END_PAUSE = 5;

  const MAX_PLAYERS = 4;


  /* =========================================================
     PALAVRAS
  ========================================================= */

  const WORDS = [
    "gato","cachorro","sol","lua","estrela","árvore","casa",
    "carro","bicicleta","avião","barco","guarda-chuva","chapéu",
    "óculos","relógio","coração","flor","peixe","pássaro",
    "borboleta","elefante","girafa","leão","macaco","cobra",
    "aranha","robô","foguete","castelo","coroa","chave","porta",
    "janela","escada","ponte","montanha","praia","ilha","vulcão",
    "arco-íris","nuvem","raio","fogo","gelo","neve","pizza",
    "hambúrguer","sorvete","bolo","maçã","banana","uva","café",
    "futebol","violão","piano","câmera","telefone","computador",
    "livro","lápis","tesoura","sapato","camiseta","bandeira",
    "fantasma","bruxa","dinossauro","dragão","sereia","unicórnio",
    "pirata","astronauta","palhaço","abelha","coelho","urso",
    "tubarão","polvo","caracol","bicicleta","skate","trem",
    "helicóptero","ambulância","bombeiro","policial","médico",
    "sanduíche","pipoca","chocolate","melancia","morango","abacaxi",
    "sushi","sorvete","hambúrguer","batata","pizza","controle",
    "videogame","televisão","fone","mouse","teclado","internet",
    "celular","cama","mesa","cadeira","sofá","geladeira","chuveiro",
    "escova","espelho","mochila","guarda-roupa","óculos de sol",
    "dinheiro","moeda","presente","balão","vela","festa"
  ];


  /* =========================================================
     CORES
  ========================================================= */

  const COLORS = [
    {name:"preto",hex:"#20211D"},
    {name:"cinza",hex:"#737373"},
    {name:"branco",hex:"#FFFFFF"},
    {name:"vermelho",hex:"#E23B3B"},
    {name:"vermelho escuro",hex:"#9E2020"},
    {name:"laranja",hex:"#FF8A3D"},
    {name:"laranja escuro",hex:"#C95B18"},
    {name:"amarelo",hex:"#FFC53D"},
    {name:"dourado",hex:"#D99B00"},
    {name:"verde",hex:"#39B36B"},
    {name:"verde escuro",hex:"#197A43"},
    {name:"azul claro",hex:"#59C7FF"},
    {name:"azul",hex:"#3E8AE0"},
    {name:"azul escuro",hex:"#24518D"},
    {name:"ciano",hex:"#2FD4C4"},
    {name:"rosa",hex:"#FF5C8A"},
    {name:"rosa claro",hex:"#FF9FBD"},
    {name:"roxo",hex:"#B490F0"},
    {name:"roxo escuro",hex:"#7046A8"},
    {name:"marrom",hex:"#8B5A35"}
  ];

  const AVATAR_COLORS = [
    "#FFC53D","#FF5C8A","#2FD4C4","#B490F0",
    "#FF8A3D","#3E8AE0","#39B36B","#E23B3B"
  ];

  const SIZES = [
    {name:"fino",v:0.006},
    {name:"médio",v:0.012},
    {name:"grosso",v:0.024}
  ];

  const ERASER_COLOR = "#FDFBF3";


  /* =========================================================
     JOGADOR
  ========================================================= */

  function uid() {
    if (window.crypto && crypto.randomUUID) {
      return crypto.randomUUID();
    }

    return "p-" + Math.random().toString(36).slice(2,10);
  }

  function hashColor(str) {
    let h = 0;

    for (let i = 0; i < str.length; i++) {
      h = (h * 31 + str.charCodeAt(i)) >>> 0;
    }

    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  function initials(name) {
    return (name || "?").trim().slice(0,2).toUpperCase();
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c];
    });
  }

  const me = {
    id:uid(),
    name:null
  };


  /* =========================================================
     ESTADO
  ========================================================= */

  let meta = null;
  let strokes = null;
  let chat = [];
  let correctGuessers = {};

  let metaVersionSeen = null;
  let strokesVersionSeen = null;
  let chatVersionSeen = null;
  let guessesVersionSeen = null;

  let pollTimer = null;
  let transitioning = false;

  let isDrawing = false;
  let currentStroke = null;

  let activeColor = COLORS[0].hex;
  let activeSize = SIZES[1].v;

  let activeTool = "brush";

  let lastStrokeWrite = 0;
  let strokesWriteInFlight = false;

  let kickedHandled = false;

  const app = document.getElementById("app");


  /* =========================================================
     FIREBASE
  ========================================================= */

  async function firebaseRequest(path, options = {}) {

    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      8000
    );

    try {

      const response = await fetch(
        FIREBASE_DB_URL + path,
        {
          ...options,
          headers:{
            "Content-Type":"application/json",
            ...(options.headers || {})
          },
          signal:controller.signal
        }
      );

      if (!response.ok) {

        const text = await response.text().catch(() => "");

        throw new Error(
          "Firebase HTTP " +
          response.status +
          (text ? ": " + text : "")
        );
      }

      return await response.json();

    } catch (e) {

      if (e.name === "AbortError") {
        throw new Error(
          "O Firebase demorou mais de 8 segundos para responder."
        );
      }

      throw e;

    } finally {
      clearTimeout(timeout);
    }
  }

  function defaultMeta() {

    return {
      players:{},
      phase:"lobby",
      round:0,
      maxRounds:0,
      drawOrder:[],
      currentDrawerId:null,
      currentWord:null,
      lastWords:[],
      roundStartAt:0,
      roundEndAt:0
    };
  }

  async function readMeta() {

    const remote = await firebaseRequest(META_PATH);
    const base = defaultMeta();

    if (!remote || typeof remote !== "object") {
      return base;
    }

    return {
      ...base,
      ...remote,
      players:
        remote.players &&
        typeof remote.players === "object"
          ? remote.players
          : {},
      drawOrder:
        Array.isArray(remote.drawOrder)
          ? remote.drawOrder
          : [],
      lastWords:
        Array.isArray(remote.lastWords)
          ? remote.lastWords
          : []
    };
  }

  async function writeMeta(next) {
    return firebaseRequest(
      META_PATH,
      {
        method:"PUT",
        body:JSON.stringify(next)
      }
    );
  }

  async function patchMeta(changes) {
    return firebaseRequest(
      META_PATH,
      {
        method:"PATCH",
        body:JSON.stringify(changes)
      }
    );
  }

  async function readStrokes() {
    return firebaseRequest(STROKES_PATH);
  }

  async function writeStrokes(next) {
    return firebaseRequest(
      STROKES_PATH,
      {
        method:"PUT",
        body:JSON.stringify(next)
      }
    );
  }

  async function readChat() {
    const data = await firebaseRequest(CHAT_PATH);
    if (!data || typeof data !== "object") return [];

    return Object.values(data)
      .sort((a,b) => (a.ts || 0) - (b.ts || 0))
      .slice(-60);
  }

  async function addChat(message) {

    const key =
      Date.now().toString(36) +
      "-" +
      Math.random().toString(36).slice(2,8);

    await firebaseRequest(
      CHAT_PATH + "/" + encodeURIComponent(key) + ".json",
      {
        method:"PUT",
        body:JSON.stringify(message)
      }
    );
  }

  async function readCorrectGuessers() {
    const data =
      await firebaseRequest(GUESSES_PATH);

    return data && typeof data === "object"
      ? data
      : {};
  }

  async function markCorrect(id) {

    await firebaseRequest(
      GUESSES_PATH + "/" +
      encodeURIComponent(id) +
      ".json",
      {
        method:"PUT",
        body:"true"
      }
    );
  }

  async function clearCorrectGuessers() {
    await firebaseRequest(
      GUESSES_PATH,
      {
        method:"PUT",
        body:"{}"
      }
    );
  }


  /* =========================================================
     JOGADORES
  ========================================================= */

  function playerIds() {
    return Object.keys(
      (meta && meta.players) || {}
    );
  }

  function sortedByJoin() {
    return playerIds().sort(function(a,b) {
      return (
        (meta.players[a].joinedAt || 0) -
        (meta.players[b].joinedAt || 0)
      );
    });
  }

  function hostId() {
    const ids = sortedByJoin();
    return ids.length ? ids[0] : null;
  }

  function isHost() {
    return me.id === hostId();
  }

  function amIDrawer() {
    return !!(
      meta &&
      meta.currentDrawerId === me.id
    );
  }

  function playerNameFromMeta(m,id) {
    return (
      m.players &&
      m.players[id]
    )
      ? m.players[id].name
      : "???";
  }


  /* =========================================================
     PALAVRAS
  ========================================================= */

  function pickWord(avoid = []) {

    const pool = WORDS.filter(
      word => !avoid.includes(word)
    );

    const list = pool.length ? pool : WORDS;

    return list[
      Math.floor(Math.random() * list.length)
    ];
  }


  /* =========================================================
     ENTRAR
  ========================================================= */

  async function joinGame(name) {

    const fresh = await readMeta();

    const ids =
      Object.keys(fresh.players || {});

    if (
      !fresh.players[me.id] &&
      ids.length >= MAX_PLAYERS
    ) {

      alert(
        "A sala já está cheia. Máximo de 4 jogadores."
      );

      me.name = null;
      render();
      return;
    }

    fresh.players[me.id] = {
      name:name,
      score:
        fresh.players[me.id]?.score || 0,
      joinedAt:
        fresh.players[me.id]?.joinedAt ||
        Date.now()
    };

    await writeMeta(fresh);

    me.name = name;
    kickedHandled = false;

    meta = fresh;
    metaVersionSeen = JSON.stringify(meta);

    render();
    startPolling();
  }


  /* =========================================================
     SAIR
  ========================================================= */

  async function leaveGame() {

    try {

      const fresh = await readMeta();

      if (!fresh) return;

      delete fresh.players[me.id];

      fresh.drawOrder =
        (fresh.drawOrder || [])
          .filter(id => id !== me.id);

      if (fresh.currentDrawerId === me.id) {
        fresh.currentDrawerId = null;
      }

      await writeMeta(fresh);

    } catch (e) {

      console.error("Erro ao sair:",e);

    } finally {

      me.name = null;
      meta = null;
      strokes = null;
      chat = [];
      correctGuessers = {};

      render();
    }
  }


  /* =========================================================
     EXPULSAR
  ========================================================= */

  async function kickPlayer(id) {

    if (!isHost()) return;

    if (id === me.id) return;

    const p = meta.players?.[id];

    if (!p) return;

    const ok = confirm(
      "Expulsar " + p.name + " da sala?"
    );

    if (!ok) return;

    try {

      const fresh = await readMeta();

      if (!isHost()) return;

      delete fresh.players[id];

      fresh.drawOrder =
        (fresh.drawOrder || [])
          .filter(x => x !== id);

      if (fresh.currentDrawerId === id) {

        const remaining =
          fresh.drawOrder.filter(
            x => fresh.players[x]
          );

        fresh.currentDrawerId =
          remaining.length
            ? remaining[0]
            : null;
      }

      await writeMeta(fresh);

      await addChat({
        system:true,
        text:p.name + " foi removido pelo anfitrião.",
        ts:Date.now()
      });

      meta = fresh;

      render();

    } catch (e) {

      console.error("Erro ao expulsar:",e);

      alert(
        "Não foi possível expulsar o jogador."
      );
    }
  }


  /* =========================================================
     INICIAR JOGO
  ========================================================= */

  async function startGame() {

    if (!isHost() || transitioning) return;

    transitioning = true;

    try {

      const fresh = await readMeta();

      const ids =
        Object.keys(fresh.players || {});

      if (ids.length < 2) {
        alert("É necessário pelo menos 2 jogadores.");
        return;
      }

      if (ids.length > MAX_PLAYERS) {
        alert("O jogo permite no máximo 4 jogadores.");
        return;
      }

      const order =
        ids.slice().sort(
          () => Math.random() - 0.5
        );

      const word = pickWord([]);

      fresh.phase = "playing";
      fresh.round = 1;
      fresh.maxRounds = order.length * 2;
      fresh.drawOrder = order;
      fresh.currentDrawerId = order[0];
      fresh.currentWord = word;
      fresh.lastWords = [word];
      fresh.roundStartAt = Date.now();
      fresh.roundEndAt = 0;

      Object.values(fresh.players).forEach(
        p => p.score = 0
      );

      await clearCorrectGuessers();

      await firebaseRequest(
        CHAT_PATH,
        {
          method:"PUT",
          body:"{}"
        }
      );

      await addChat({
        system:true,
        text:
          "Rodada 1: " +
          playerNameFromMeta(
            fresh,
            order[0]
          ) +
          " vai desenhar!",
        ts:Date.now()
      });

      await writeStrokes({
        round:1,
        strokes:[],
        drawerId:order[0]
      });

      await writeMeta(fresh);

      meta = fresh;

      strokes = {
        round:1,
        strokes:[],
        drawerId:order[0]
      };

      correctGuessers = {};
      chat = [];

      metaVersionSeen = JSON.stringify(meta);
      strokesVersionSeen =
        JSON.stringify(strokes.strokes);

      render();

    } catch (e) {

      console.error("Erro ao iniciar:",e);

      alert(
        "Não foi possível iniciar a partida."
      );

    } finally {
      transitioning = false;
    }
  }


  /* =========================================================
     FINALIZAR RODADA
  ========================================================= */

  async function endRoundNow(reason) {

    if (!isHost() || transitioning) return;

    transitioning = true;

    try {

      const fresh = await readMeta();

      if (
        !fresh ||
        fresh.phase !== "playing"
      ) {
        return;
      }

      fresh.phase = "round-end";
      fresh.roundEndAt =
        Date.now() +
        ROUND_END_PAUSE * 1000;

      await addChat({
        system:true,
        text:reason,
        ts:Date.now()
      });

      await writeMeta(fresh);

      meta = fresh;
      metaVersionSeen =
        JSON.stringify(meta);

      render();

    } catch (e) {

      console.error(
        "Erro ao finalizar rodada:",
        e
      );

    } finally {

      transitioning = false;
    }
  }


  /* =========================================================
     PRÓXIMA RODADA
  ========================================================= */

  async function advanceRound() {

    if (!isHost() || transitioning) return;

    transitioning = true;

    try {

      const fresh = await readMeta();

      if (
        !fresh ||
        fresh.phase !== "round-end"
      ) {
        return;
      }

      const nextRound =
        (fresh.round || 0) + 1;

      if (nextRound > fresh.maxRounds) {

        fresh.phase = "game-end";
        fresh.roundEndAt = 0;

        await writeMeta(fresh);

        meta = fresh;
        render();

        return;
      }

      const order = fresh.drawOrder || [];

      if (!order.length) return;

      const activeOrder =
        order.filter(
          id => fresh.players?.[id]
        );

      if (!activeOrder.length) return;

      const nextDrawer =
        activeOrder[
          (nextRound - 1) %
          activeOrder.length
        ];

      const word =
        pickWord(
          (fresh.lastWords || []).slice(-8)
        );

      fresh.phase = "playing";
      fresh.round = nextRound;
      fresh.currentDrawerId = nextDrawer;
      fresh.currentWord = word;

      fresh.lastWords =
        (fresh.lastWords || [])
          .concat([word])
          .slice(-10);

      fresh.roundStartAt = Date.now();
      fresh.roundEndAt = 0;

      await clearCorrectGuessers();

      await addChat({
        system:true,
        text:
          "Rodada " +
          nextRound +
          ": " +
          playerNameFromMeta(
            fresh,
            nextDrawer
          ) +
          " vai desenhar!",
        ts:Date.now()
      });

      await writeStrokes({
        round:nextRound,
        strokes:[],
        drawerId:nextDrawer
      });

      await writeMeta(fresh);

      meta = fresh;

      strokes = {
        round:nextRound,
        strokes:[],
        drawerId:nextDrawer
      };

      correctGuessers = {};

      metaVersionSeen =
        JSON.stringify(meta);

      strokesVersionSeen =
        JSON.stringify(strokes.strokes);

      render();

    } catch (e) {

      console.error(
        "Erro ao avançar rodada:",
        e
      );

    } finally {

      transitioning = false;
    }
  }


  /* =========================================================
     JOGAR NOVAMENTE
  ========================================================= */

  async function playAgain() {

    if (!isHost() || transitioning) return;

    transitioning = true;

    try {

      const fresh = await readMeta();

      fresh.phase = "lobby";
      fresh.round = 0;
      fresh.maxRounds = 0;
      fresh.drawOrder = [];
      fresh.currentDrawerId = null;
      fresh.currentWord = null;
      fresh.lastWords = [];
      fresh.roundStartAt = 0;
      fresh.roundEndAt = 0;

      Object.values(
        fresh.players || {}
      ).forEach(
        p => p.score = 0
      );

      await clearCorrectGuessers();

      await firebaseRequest(
        CHAT_PATH,
        {
          method:"PUT",
          body:"{}"
        }
      );

      await writeStrokes({
        round:0,
        strokes:[],
        drawerId:null
      });

      await writeMeta(fresh);

      meta = fresh;
      strokes = {
        round:0,
        strokes:[],
        drawerId:null
      };

      correctGuessers = {};
      chat = [];

      render();

    } catch (e) {

      console.error(
        "Erro ao reiniciar:",
        e
      );

      alert(
        "Não foi possível reiniciar a partida."
      );

    } finally {
      transitioning = false;
    }
  }


  /* =========================================================
     PALPITE
  ========================================================= */

  async function sendGuess(text) {

    text = text.trim();

    if (!text) return;

    try {

      // Lê o estado atual para não usar palavra antiga
      const fresh = await readMeta();

      if (
        !fresh ||
        fresh.phase !== "playing"
      ) {
        return;
      }

      if (fresh.currentDrawerId === me.id) {
        return;
      }

      const latestGuesses =
        await readCorrectGuessers();

      if (latestGuesses[me.id]) {
        return;
      }

      const normalizedText =
        text
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .trim();

      const normalizedWord =
        (fresh.currentWord || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .trim();

      const isCorrect =
        normalizedText === normalizedWord;

      const myName =
        fresh.players?.[me.id]?.name ||
        "Alguém";

      if (isCorrect) {

        /*
         * IMPORTANTE:
         * Os acertos são gravados separadamente.
         * Assim um jogador não apaga o acerto de outro.
         */

        const elapsed =
          (Date.now() - fresh.roundStartAt) / 1000;

        const remaining =
          Math.max(
            0,
            ROUND_DURATION - elapsed
          );

        const pts =
          Math.max(
            15,
            Math.round(
              100 *
              (remaining / ROUND_DURATION)
            )
          );

        await markCorrect(me.id);

        /*
         * Atualiza o placar do jogador.
         * PATCH impede que os outros jogadores
         * sejam apagados.
         */

        const currentPlayer =
          fresh.players?.[me.id];

        if (!currentPlayer) return;

        await patchMeta({
          ["players/" + me.id + "/score"]:
            (currentPlayer.score || 0) + pts
        });

        /*
         * Pontos para o desenhista.
         */

        if (
          fresh.currentDrawerId &&
          fresh.players[fresh.currentDrawerId]
        ) {

          const drawer =
            fresh.players[fresh.currentDrawerId];

          await patchMeta({
            ["players/" +
             fresh.currentDrawerId +
             "/score"]:
              (drawer.score || 0) +
              Math.round(pts / 2)
          });
        }

        await addChat({
          correct:true,
          text:"🎉 " + myName + " acertou!",
          ts:Date.now()
        });

        /*
         * Espera um instante para o Firebase
         * registrar todos os acertos.
         */

        await new Promise(
          resolve => setTimeout(resolve,120)
        );

        /*
         * SOMENTE O HOST verifica se todos acertaram.
         */

        if (isHost()) {

          const latestMeta =
            await readMeta();

          const latestCorrect =
            await readCorrectGuessers();

          const playersWhoNeedToGuess =
            Object.keys(
              latestMeta.players || {}
            ).filter(
              id =>
                id !==
                latestMeta.currentDrawerId
            );

          const everyoneGuessed =
            playersWhoNeedToGuess.length > 0 &&
            playersWhoNeedToGuess.every(
              id => latestCorrect[id] === true
            );

          if (
            everyoneGuessed &&
            latestMeta.phase === "playing"
          ) {

            await endRoundNow(
              "🎉 Todo mundo acertou!"
            );
          }
        }

      } else {

        /*
         * Cada mensagem tem sua própria chave no Firebase.
         * Portanto uma mensagem não apaga outra.
         */

        await addChat({
          playerId:me.id,
          who:myName,
          text:text,
          ts:Date.now()
        });
      }

      meta = await readMeta();
      correctGuessers =
        await readCorrectGuessers();
      chat = await readChat();

      render();

    } catch (e) {

      console.error(
        "Erro ao enviar palpite:",
        e
      );
    }
  }


  /* =========================================================
     POLLING
  ========================================================= */

  function startPolling() {

    if (pollTimer) return;

    pollTimer =
      setInterval(
        pollTick,
        POLL_MS
      );
  }

  async function pollTick() {

    try {

      const [
        m,
        s,
        c,
        g
      ] = await Promise.all([
        readMeta(),
        readStrokes(),
        readChat(),
        readCorrectGuessers()
      ]);

      let changed = false;

      if (m) {

        const v =
          JSON.stringify(m);

        if (v !== metaVersionSeen) {

          metaVersionSeen = v;
          meta = m;
          changed = true;
        }
      }

      /*
       * CORREÇÃO DOS TRAÇOS:
       *
       * Enquanto o desenhista está desenhando,
       * não substituímos imediatamente o desenho local
       * por uma versão antiga vinda do Firebase.
       *
       * Isso evita o traço "sumir".
       */

      if (s) {

        const remoteVersion =
          JSON.stringify(
            s.strokes || []
          );

        const remoteRound =
          s.round;

        const localRound =
          strokes?.round;

        const shouldAccept =
          !amIDrawer() ||
          !isDrawing ||
          remoteRound !== localRound;

        if (
          remoteVersion !==
          strokesVersionSeen &&
          shouldAccept
        ) {

          strokesVersionSeen =
            remoteVersion;

          strokes = s;

          changed = true;

          drawAllStrokes();
        }
      }

      if (c) {

        const v =
          JSON.stringify(c);

        if (v !== chatVersionSeen) {

          chatVersionSeen = v;
          chat = c;
          changed = true;
        }
      }

      if (g) {

        const v =
          JSON.stringify(g);

        if (v !== guessesVersionSeen) {

          guessesVersionSeen = v;
          correctGuessers = g;
          changed = true;
        }
      }

      /*
       * Se fui expulso, volto para a tela inicial.
       */

      if (
        me.name &&
        meta &&
        !meta.players?.[me.id] &&
        !kickedHandled
      ) {

        kickedHandled = true;

        alert(
          "Você foi removido da sala pelo anfitrião."
        );

        me.name = null;
        meta = null;
        strokes = null;
        chat = [];
        correctGuessers = {};

        render();

        return;
      }

      if (changed) {
        render();
      }

      checkTimers();

    } catch (e) {

      console.error(
        "Erro no polling:",
        e
      );
    }
  }


  /* =========================================================
     TIMER
  ========================================================= */

  function checkTimers() {

    if (!meta) return;

    const now = Date.now();

    if (meta.phase === "playing") {

      const remaining =
        (
          meta.roundStartAt +
          ROUND_DURATION * 1000
        ) - now;

      if (
        remaining <= 0 &&
        isHost()
      ) {

        endRoundNow(
          "⏰ Tempo esgotado!"
        );
      }

    } else if (
      meta.phase === "round-end"
    ) {

      if (
        meta.roundEndAt &&
        now >= meta.roundEndAt &&
        isHost()
      ) {

        advanceRound();
      }
    }

    updateTimerDisplay();
  }

  function updateTimerDisplay() {

    const el =
      document.getElementById(
        "timer-val"
      );

    if (
      !el ||
      !meta ||
      meta.phase !== "playing"
    ) {
      return;
    }

    const remaining =
      Math.max(
        0,
        Math.ceil(
          (
            meta.roundStartAt +
            ROUND_DURATION * 1000 -
            Date.now()
          ) / 1000
        )
      );

    const min =
      Math.floor(remaining / 60);

    const sec =
      remaining % 60;

    el.textContent =
      min + ":" +
      String(sec).padStart(2,"0");

    if (el.parentElement) {

      el.parentElement.classList.toggle(
        "low",
        remaining <= 30
      );
    }
  }

  setInterval(
    function () {

      if (
        meta &&
        meta.phase === "playing"
      ) {
        updateTimerDisplay();
      }

    },
    1000
  );


  /* =========================================================
     CANVAS
  ========================================================= */

  function getCanvas() {
    return document.getElementById("board");
  }

  function canvasPos(evt,canvas) {

    const rect =
      canvas.getBoundingClientRect();

    const cx =
      evt.touches
        ? evt.touches[0].clientX
        : evt.clientX;

    const cy =
      evt.touches
        ? evt.touches[0].clientY
        : evt.clientY;

    return {
      x:Math.min(
        1,
        Math.max(
          0,
          (cx - rect.left) / rect.width
        )
      ),
      y:Math.min(
        1,
        Math.max(
          0,
          (cy - rect.top) / rect.height
        )
      )
    };
  }


  /* =========================================================
     RENDERIZAÇÃO DOS TRAÇOS
  ========================================================= */

  function drawAllStrokes() {

    const canvas = getCanvas();

    if (!canvas) return;

    const ctx =
      canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;

    ctx.clearRect(0,0,W,H);

    ctx.fillStyle = ERASER_COLOR;
    ctx.fillRect(0,0,W,H);

    const list =
      (strokes && strokes.strokes) || [];

    list.forEach(function(st) {

      /*
       * Pincel
       */

      if (
        st.type === "stroke" &&
        st.points &&
        st.points.length
      ) {

        ctx.beginPath();

        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = st.color;
        ctx.lineWidth =
          Math.max(
            1,
            st.size * W
          );

        ctx.moveTo(
          st.points[0].x * W,
          st.points[0].y * H
        );

        if (st.points.length === 1) {

          ctx.lineTo(
            st.points[0].x * W + .1,
            st.points[0].y * H
          );

        } else {

          for (
            let i = 1;
            i < st.points.length;
            i++
          ) {

            ctx.lineTo(
              st.points[i].x * W,
              st.points[i].y * H
            );
          }
        }

        ctx.stroke();

        return;
      }

      /*
       * Ponto
       */

      if (
        st.type === "dot"
      ) {

        ctx.beginPath();

        ctx.fillStyle = st.color;

        ctx.arc(
          st.x * W,
          st.y * H,
          Math.max(1,st.size * W / 2),
          0,
          Math.PI * 2
        );

        ctx.fill();

        return;
      }

      /*
       * BALDE
       *
       * O balde é salvo como uma imagem PNG.
       * Isso garante que todos os jogadores vejam
       * exatamente o mesmo preenchimento.
       */

      if (
        st.type === "fill" &&
        st.image
      ) {

        const img = new Image();

        img.onload = function() {

          ctx.drawImage(
            img,
            0,
            0,
            W,
            H
          );
        };

        img.src = st.image;
      }

    });
  }

  function resizeCanvasBacking() {

    const canvas = getCanvas();

    if (!canvas) return;

    canvas.width = 700;
    canvas.height = 440;

    drawAllStrokes();
  }


  /* =========================================================
     BALDE
  ========================================================= */

  function floodFill(canvas,x,y,color) {

    const ctx =
      canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;

    const image =
      ctx.getImageData(
        0,
        0,
        W,
        H
      );

    const data = image.data;

    const startIndex =
      (y * W + x) * 4;

    const targetR = data[startIndex];
    const targetG = data[startIndex + 1];
    const targetB = data[startIndex + 2];
    const targetA = data[startIndex + 3];

    const temp =
      document.createElement("canvas");

    temp.width = W;
    temp.height = H;

    const tctx =
      temp.getContext("2d");

    tctx.putImageData(image,0,0);

    const fillColor =
      hexToRgba(color);

    /*
     * Se já é a mesma cor, não faz nada.
     */

    if (
      targetR === fillColor[0] &&
      targetG === fillColor[1] &&
      targetB === fillColor[2]
    ) {
      return temp;
    }

    const stack = [[x,y]];

    function matches(px,py) {

      if (
        px < 0 ||
        py < 0 ||
        px >= W ||
        py >= H
      ) {
        return false;
      }

      const i =
        (py * W + px) * 4;

      return (
        Math.abs(data[i] - targetR) <= 10 &&
        Math.abs(data[i+1] - targetG) <= 10 &&
        Math.abs(data[i+2] - targetB) <= 10 &&
        Math.abs(data[i+3] - targetA) <= 10
      );
    }

    while (stack.length) {

      const point =
        stack.pop();

      const px = point[0];
      const py = point[1];

      if (!matches(px,py)) continue;

      const i =
        (py * W + px) * 4;

      data[i] = fillColor[0];
      data[i+1] = fillColor[1];
      data[i+2] = fillColor[2];
      data[i+3] = 255;

      stack.push([px+1,py]);
      stack.push([px-1,py]);
      stack.push([px,py+1]);
      stack.push([px,py-1]);
    }

    image.data.set(data);

    tctx.putImageData(image,0,0);

    return temp;
  }

  function hexToRgba(hex) {

    const h =
      hex.replace("#","");

    const value =
      parseInt(h,16);

    return [
      (value >> 16) & 255,
      (value >> 8) & 255,
      value & 255,
      255
    ];
  }


  /* =========================================================
     SALVAR BALDE
  ========================================================= */

  async function useBucket(evt) {

    if (
      !amIDrawer() ||
      !meta ||
      meta.phase !== "playing"
    ) {
      return;
    }

    const canvas = getCanvas();

    if (!canvas) return;

    const p =
      canvasPos(evt,canvas);

    const x =
      Math.floor(
        p.x * canvas.width
      );

    const y =
      Math.floor(
        p.y * canvas.height
      );

    /*
     * O canvas já contém todos os traços atuais.
     */

    const result =
      floodFill(
        canvas,
        x,
        y,
        activeColor
      );

    if (!result) return;

    const image =
      result.toDataURL(
        "image/png"
      );

    const fillStroke = {
      type:"fill",
      color:activeColor,
      image:image
    };

    if (!strokes) {

      strokes = {
        round:meta.round,
        strokes:[],
        drawerId:me.id
      };
    }

    strokes.strokes =
      (strokes.strokes || [])
        .concat([fillStroke]);

    drawAllStrokes();

    await flushStrokes();
  }


  /* =========================================================
     DESENHO
  ========================================================= */

  function setupCanvasEvents() {

    const canvas = getCanvas();

    if (!canvas) return;

    const start =
      function(e) {

        if (
          !amIDrawer() ||
          !meta ||
          meta.phase !== "playing"
        ) {
          return;
        }

        e.preventDefault();

        if (activeTool === "bucket") {

          useBucket(e);
          return;
        }

        isDrawing = true;

        const p =
          canvasPos(e,canvas);

        currentStroke = {
          type:"stroke",
          color:activeColor,
          size:activeSize,
          points:[p]
        };

        if (
          !strokes ||
          strokes.round !== meta.round
        ) {

          strokes = {
            round:meta.round,
            strokes:[],
            drawerId:me.id
          };
        }

        strokes.strokes =
          (strokes.strokes || [])
            .concat([currentStroke]);

        drawAllStrokes();
      };


    const move =
      function(e) {

        if (
          !isDrawing ||
          !currentStroke
        ) {
          return;
        }

        e.preventDefault();

        const p =
          canvasPos(e,canvas);

        currentStroke.points.push(p);

        drawAllStrokes();

        const now = Date.now();

        if (
          now - lastStrokeWrite > 100 &&
          !strokesWriteInFlight
        ) {

          lastStrokeWrite = now;

          flushStrokes();
        }
      };


    const end =
      function() {

        if (!isDrawing) return;

        isDrawing = false;

        currentStroke = null;

        flushStrokes();
      };


    canvas.addEventListener(
      "mousedown",
      start
    );

    canvas.addEventListener(
      "mousemove",
      move
    );

    window.addEventListener(
      "mouseup",
      end
    );

    canvas.addEventListener(
      "touchstart",
      start,
      {passive:false}
    );

    canvas.addEventListener(
      "touchmove",
      move,
      {passive:false}
    );

    canvas.addEventListener(
      "touchend",
      end
    );
  }


  async function flushStrokes() {

    if (
      !strokes ||
      !amIDrawer()
    ) {
      return;
    }

    if (strokesWriteInFlight) return;

    strokesWriteInFlight = true;

    try {

      const snapshot = {
        round:strokes.round,
        strokes:strokes.strokes,
        drawerId:me.id
      };

      await writeStrokes(snapshot);

      strokesVersionSeen =
        JSON.stringify(
          snapshot.strokes || []
        );

    } catch (e) {

      console.error(
        "Erro ao salvar desenho:",
        e
      );

    } finally {

      strokesWriteInFlight = false;
    }
  }


  async function clearCanvas() {

    if (!amIDrawer()) return;

    strokes = {
      round:meta.round,
      strokes:[],
      drawerId:me.id
    };

    drawAllStrokes();

    await writeStrokes(strokes);

    strokesVersionSeen =
      JSON.stringify([]);
  }


  /* =========================================================
     FRAME
  ========================================================= */

  function wobbleFrame() {

    return `
      <svg
        class="wobble"
        viewBox="0 0 700 440"
        preserveAspectRatio="none"
      >
        <rect
          x="4"
          y="4"
          width="692"
          height="432"
          rx="10"
          fill="none"
          stroke="#FFC53D"
          stroke-width="3"
          opacity=".55"
        />
      </svg>
    `;
  }


  /* =========================================================
     RENDER
  ========================================================= */

  function render() {

    if (!me.name || !meta) {
      renderLanding();
      return;
    }

    switch(meta.phase) {

      case "lobby":
        renderLobby();
        break;

      case "playing":
        renderPlaying();
        break;

      case "round-end":
        renderRoundEnd();
        break;

      case "game-end":
        renderGameEnd();
        break;

      default:
        renderLobby();
    }
  }


  /* =========================================================
     TELA INICIAL
  ========================================================= */

  function renderLanding() {

    app.innerHTML = `
      <div class="card">

        <h2 style="margin-top:0;">
          Entrar na sala
        </h2>

        <p class="hint">
          Digite seu nome para entrar.
        </p>

        <div class="join-row">

          <input
            type="text"
            id="name-input"
            placeholder="Seu nome"
            maxlength="16"
            autocomplete="off"
          />

          <button id="join-btn">
            Entrar
          </button>

        </div>

        <div class="status-box">
          🌐 Multiplayer online:
          os dados são sincronizados pelo Firebase.
        </div>

      </div>
    `;

    const input =
      document.getElementById("name-input");

    const btn =
      document.getElementById("join-btn");

    async function go() {

      const name =
        input.value.trim();

      if (!name) {
        input.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = "Entrando...";

      try {

        await joinGame(name);

      } catch (e) {

        console.error(
          "Erro ao entrar:",
          e
        );

        me.name = null;

        alert(
          "Não foi possível entrar no jogo.\n\n" +
          (e.message || "Erro desconhecido")
        );

        render();

      } finally {

        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    }

    btn.addEventListener("click",go);

    input.addEventListener(
      "keydown",
      function(e) {
        if (e.key === "Enter") go();
      }
    );

    input.focus();
  }


  /* =========================================================
     LOBBY
  ========================================================= */

  function renderLobby() {

    const ids = sortedByJoin();
    const host = hostId();

    const playersHtml =
      ids.map(function(id) {

        const p = meta.players[id];
        const color = hashColor(id);

        return `
          <div class="chip">

            <div
              class="avatar"
              style="background:${color}"
            >
              ${escapeHtml(initials(p.name))}
            </div>

            <span>
              ${escapeHtml(p.name)}
              ${id === me.id ? " (você)" : ""}
            </span>

            ${
              id === host
                ? `
                  <span class="host-badge">
                    ★ anfitrião
                  </span>
                `
                : ""
            }

            ${
              isHost() && id !== me.id
                ? `
                  <button
                    class="kick-btn"
                    data-kick="${id}"
                  >
                    expulsar
                  </button>
                `
                : ""
            }

          </div>
        `;
      }).join("");

    app.innerHTML = `
      <div class="card">

        <h2 style="margin-top:0;">
          Sala de espera
        </h2>

        <div class="player-list">

          ${
            playersHtml ||
            `
              <span class="hint">
                Ninguém entrou ainda.
              </span>
            `
          }

        </div>

        ${
          isHost()
            ? `
              <div class="admin-box">

                <div class="admin-title">
                  👑 Controles do anfitrião
                </div>

                <div class="hint">
                  Você pode expulsar jogadores antes
                  de iniciar a partida.
                </div>

              </div>
            `
            : ""
        }

        <div
          class="join-row"
          style="margin-top:20px;"
        >

          ${
            isHost()
              ? `
                <button
                  id="start-btn"
                  ${ids.length < 2 ? "disabled" : ""}
                >
                  Iniciar jogo
                </button>
              `
              : `
                <span class="hint">
                  Aguardando
                  ${escapeHtml(
                    meta.players[host]?.name || ""
                  )}
                  iniciar...
                </span>
              `
          }

          <button
            class="secondary"
            id="leave-btn"
          >
            Sair
          </button>

        </div>

        ${
          ids.length < 2
            ? `
              <p class="hint">
                Precisa de pelo menos 2 jogadores
                para começar.
              </p>
            `
            : `
              <p class="hint">
                ${ids.length} jogador(es) prontos.
                Cada jogador desenha 2 vezes.
                Cada rodada dura 5 minutos.
              </p>
            `
        }

      </div>
    `;

    const start =
      document.getElementById("start-btn");

    if (start) {
      start.addEventListener(
        "click",
        startGame
      );
    }

    const leave =
      document.getElementById("leave-btn");

    if (leave) {
      leave.addEventListener(
        "click",
        leaveGame
      );
    }

    document
      .querySelectorAll("[data-kick]")
      .forEach(btn => {

        btn.addEventListener(
          "click",
          function() {
            kickPlayer(
              btn.dataset.kick
            );
          }
        );
      });
  }


  /* =========================================================
     PLACAR
  ========================================================= */

  function scoreboardHtml() {

    const ids =
      playerIds()
        .slice()
        .sort(function(a,b) {

          return (
            (meta.players[b].score || 0) -
            (meta.players[a].score || 0)
          );
        });

    return `
      <div class="scoreboard">

        ${
          ids.map(function(id) {

            const p = meta.players[id];
            const color = hashColor(id);

            const drawing =
              meta.currentDrawerId === id;

            return `
              <div
                class="
                  score-row
                  ${drawing ? "drawing" : ""}
                "
              >

                <div
                  class="avatar"
                  style="
                    background:${color};
                    width:22px;
                    height:22px;
                    font-size:11px;
                  "
                >
                  ${escapeHtml(initials(p.name))}
                </div>

                <div class="name">

                  ${escapeHtml(p.name)}

                  ${id === me.id ? " (você)" : ""}

                  ${drawing ? " ✏️" : ""}

                </div>

                <div class="pts">
                  ${p.score || 0}
                </div>

              </div>
            `;
          }).join("")
        }

      </div>
    `;
  }


  /* =========================================================
     CHAT
  ========================================================= */

  function chatHtml() {

    return (chat || [])
      .map(function(m) {

        if (m.system) {

          return `
            <div class="chat-msg system">
              ${escapeHtml(m.text)}
            </div>
          `;
        }

        if (m.correct) {

          return `
            <div class="chat-msg correct">
              ${escapeHtml(m.text)}
            </div>
          `;
        }

        return `
          <div class="chat-msg">

            <span class="who">
              ${escapeHtml(m.who)}:
            </span>

            ${escapeHtml(m.text)}

          </div>
        `;

      })
      .join("");
  }


  /* =========================================================
     JOGO
  ========================================================= */

  function renderPlaying() {

    const drawer = amIDrawer();

    const drawerName =
      meta.players[
        meta.currentDrawerId
      ]?.name || "???";

    const remaining =
      Math.max(
        0,
        Math.ceil(
          (
            meta.roundStartAt +
            ROUND_DURATION * 1000 -
            Date.now()
          ) / 1000
        )
      );

    const alreadyCorrect =
      !!correctGuessers[me.id];

    let wordDisplay;

    if (drawer) {

      wordDisplay =
        meta.currentWord || "";

    } else {

      wordDisplay =
        (meta.currentWord || "")
          .split("")
          .map(function(ch) {
            return ch === " "
              ? "  "
              : "_";
          })
          .join(" ");
    }

    app.innerHTML = `

      <div class="game-top">

        <div class="round-info">

          Rodada
          <b>${meta.round}</b>

          de

          <b>${meta.maxRounds}</b>

          ·

          ${
            drawer
              ? "Sua vez de desenhar!"
              : escapeHtml(drawerName) +
                " está desenhando"
          }

        </div>

        <div class="timer">

          <span id="timer-val">
            ${formatTime(remaining)}
          </span>

        </div>

      </div>


      <div
        class="
          word-banner
          ${drawer ? "drawer" : ""}
        "
      >
        ${escapeHtml(wordDisplay)}
      </div>


      <div class="play-area">

        <div class="canvas-col">

          <div
            class="card"
            style="padding:12px;"
          >

            <div class="canvas-frame">

              ${wobbleFrame()}

              <canvas
                id="board"
                width="700"
                height="440"
              ></canvas>

            </div>


            ${
              drawer
                ? `

                  <div class="tools">

                    ${
                      COLORS.map(function(c) {

                        return `
                          <div
                            class="
                              swatch
                              ${
                                c.hex === activeColor
                                  ? "active"
                                  : ""
                              }
                            "
                            data-color="${c.hex}"
                            style="
                              background:${c.hex}
                            "
                            title="${c.name}"
                          ></div>
                        `;

                      }).join("")
                    }


                    <div
                      style="
                        width:1px;
                        height:22px;
                        background:var(--line);
                        margin:0 3px;
                      "
                    ></div>


                    ${
                      SIZES.map(function(s) {

                        const size =
                          10 + s.v * 300;

                        return `
                          <div
                            class="
                              size-dot
                              ${
                                s.v === activeSize
                                  ? "active"
                                  : ""
                              }
                            "
                            data-size="${s.v}"
                            style="
                              width:${size}px;
                              height:${size}px;
                            "
                            title="${s.name}"
                          ></div>
                        `;

                      }).join("")
                    }


                    <button
                      class="
                        secondary
                        tool-btn
                        ${activeTool === "brush" ? "active" : ""}
                      "
                      id="brush-btn"
                    >
                      🖌️
                    </button>


                    <button
                      class="
                        secondary
                        tool-btn
                        ${activeTool === "bucket" ? "active" : ""}
                      "
                      id="bucket-btn"
                    >
                      🪣
                    </button>


                    <div style="flex:1"></div>


                    <button
                      class="secondary"
                      id="clear-btn"
                    >
                      Limpar
                    </button>

                  </div>

                  <p class="hint">
                    🪣 Selecione o balde e clique dentro
                    de uma área fechada para preenchê-la.
                  </p>

                `
                : `
                  <p class="hint">
                    Só quem está desenhando pode usar
                    o quadro. Tente adivinhar no chat! →
                  </p>
                `
            }

          </div>

        </div>


        <div class="side-col">

          <div
            class="card"
            style="padding:12px;"
          >

            <h3
              style="
                margin:0 0 8px;
                font-size:15px;
              "
            >
              Placar
            </h3>

            ${scoreboardHtml()}

          </div>


          <div class="chat">

            <div
              class="chat-log"
              id="chat-log"
            >
              ${chatHtml()}
            </div>


            ${
              drawer
                ? `
                  <p
                    class="hint"
                    style="margin:8px 0 0;"
                  >
                    Você está desenhando —
                    não pode enviar palpites.
                  </p>
                `
                : alreadyCorrect
                  ? `
                    <p
                      class="hint"
                      style="margin:8px 0 0;"
                    >
                      Você acertou!
                      Aguarde os outros jogadores. 🎉
                    </p>
                  `
                  : `
                    <div class="chat-form">

                      <input
                        type="text"
                        id="guess-input"
                        placeholder="Digite seu palpite..."
                        maxlength="40"
                        autocomplete="off"
                      />

                      <button id="guess-btn">
                        Enviar
                      </button>

                    </div>
                  `
            }

          </div>

        </div>

      </div>
    `;


    resizeCanvasBacking();

    setupCanvasEvents();


    if (drawer) {

      document
        .querySelectorAll(".swatch")
        .forEach(function(el) {

          el.addEventListener(
            "click",
            function() {

              activeColor =
                el.dataset.color;

              render();
            }
          );
        });


      document
        .querySelectorAll(".size-dot")
        .forEach(function(el) {

          el.addEventListener(
            "click",
            function() {

              activeSize =
                parseFloat(
                  el.dataset.size
                );

              render();
            }
          );
        });


      document
        .getElementById("brush-btn")
        .addEventListener(
          "click",
          function() {

            activeTool = "brush";
            render();
          }
        );


      document
        .getElementById("bucket-btn")
        .addEventListener(
          "click",
          function() {

            activeTool = "bucket";
            render();
          }
        );


      document
        .getElementById("clear-btn")
        .addEventListener(
          "click",
          clearCanvas
        );

    } else if (!alreadyCorrect) {

      const input =
        document.getElementById(
          "guess-input"
        );

      const btn =
        document.getElementById(
          "guess-btn"
        );

      function go() {

        const value =
          input.value;

        input.value = "";

        sendGuess(value);
      }

      btn.addEventListener(
        "click",
        go
      );

      input.addEventListener(
        "keydown",
        function(e) {

          if (e.key === "Enter") {
            go();
          }
        }
      );

      input.focus();
    }


    const log =
      document.getElementById(
        "chat-log"
      );

    if (log) {
      log.scrollTop =
        log.scrollHeight;
    }
  }


  function formatTime(seconds) {

    const min =
      Math.floor(seconds / 60);

    const sec =
      seconds % 60;

    return (
      min +
      ":" +
      String(sec).padStart(2,"0")
    );
  }


  /* =========================================================
     FIM DA RODADA
  ========================================================= */

  function renderRoundEnd() {

    app.innerHTML = `

      <div class="card reveal">

        <div class="hint">
          A palavra era
        </div>

        <div class="w">
          ${escapeHtml(
            meta.currentWord || ""
          )}
        </div>

        <div class="sub">
          ${
            meta.roundEndAt
              ? "Próxima rodada em instantes..."
              : ""
          }
        </div>

      </div>


      <div
        class="card"
        style="padding:12px;"
      >

        <h3
          style="
            margin:0 0 8px;
            font-size:15px;
          "
        >
          Placar
        </h3>

        ${scoreboardHtml()}

      </div>
    `;
  }


  /* =========================================================
     FIM DO JOGO
  ========================================================= */

  function renderGameEnd() {

    const ids =
      playerIds()
        .slice()
        .sort(function(a,b) {

          return (
            (meta.players[b].score || 0) -
            (meta.players[a].score || 0)
          );
        });

    const winner =
      ids[0]
        ? meta.players[ids[0]]
        : null;

    app.innerHTML = `

      <div
        class="card winner-banner"
      >

        <div class="hint">
          Fim de jogo!
        </div>

        <div class="w">

          ${
            winner
              ? "🏆 " +
                escapeHtml(winner.name) +
                " venceu!"
              : ""
          }

        </div>

      </div>


      <div
        class="card"
        style="padding:12px;"
      >

        <h3
          style="
            margin:0 0 8px;
            font-size:15px;
          "
        >
          Placar final
        </h3>

        ${scoreboardHtml()}

      </div>


      <div class="join-row">

        ${
          isHost()
            ? `
              <button id="again-btn">
                Jogar novamente
              </button>
            `
            : `
              <span class="hint">
                Aguardando o anfitrião reiniciar...
              </span>
            `
        }

        <button
          class="secondary"
          id="leave-btn2"
        >
          Sair
        </button>

      </div>
    `;

    const again =
      document.getElementById(
        "again-btn"
      );

    if (again) {
      again.addEventListener(
        "click",
        playAgain
      );
    }

    const leave =
      document.getElementById(
        "leave-btn2"
      );

    if (leave) {
      leave.addEventListener(
        "click",
        leaveGame
      );
    }
  }


  /* =========================================================
     BOOT
  ========================================================= */

  async function boot() {

    try {

      meta = await readMeta();

      if (!meta) {
        meta = defaultMeta();
      }

      metaVersionSeen =
        JSON.stringify(meta);

      strokes =
        await readStrokes();

      if (strokes) {

        strokesVersionSeen =
          JSON.stringify(
            strokes.strokes || []
          );
      }

      chat =
        await readChat();

      chatVersionSeen =
        JSON.stringify(chat);

      correctGuessers =
        await readCorrectGuessers();

      guessesVersionSeen =
        JSON.stringify(correctGuessers);

      render();

      startPolling();

    } catch (e) {

      console.error(
        "Erro ao iniciar:",
        e
      );

      meta = defaultMeta();

      renderLanding();

      const box =
        document.querySelector(
          ".status-box"
        );

      if (box) {

        box.innerHTML =
          "⚠️ Não foi possível conectar ao Firebase.";
      }
    }
  }


  boot();

})();
</script>

</body>
</html>
